<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM Pedidos — Burrito Jack</title>
  <link rel="icon" href="logo.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --rojo:#B71C1C; --rojo2:#8B0000;
      --amarillo:#FFD600; --amarillo2:#F5C842;
      --verde:#25D366; --negro:#1a0800; --negro2:#2d1000;
      --crema:#FFF8E1; --dim:rgba(255,248,225,.55);
      --texto:#1a0800; --fondo:#FFFFFF; --fondo2:#FBF7F2;
      --dim-dark:rgba(60,20,0,.58);
    }
    html { scroll-behavior:smooth; }
    body { font-family:'Montserrat',sans-serif; background:var(--fondo2); color:var(--texto); min-height:100vh; }
    body::before { display:none; }

    header { background:rgba(255,255,255,.97); border-bottom:1px solid rgba(183,28,28,.12); box-shadow:0 2px 14px rgba(0,0,0,.07); padding:12px 32px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(8px); }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .logo img { height:40px; border-radius:50%; }
    .logo-txt { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; color:var(--rojo); letter-spacing:3px; }
    .header-badge { font-size:.52rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:rgba(139,0,0,.6); background:rgba(183,28,28,.07); border:1px solid rgba(183,28,28,.15); padding:3px 12px; }
    .header-nav a { text-decoration:none; color:rgba(30,10,0,.45); font-size:.58rem; font-weight:600; letter-spacing:3px; text-transform:uppercase; padding:6px 14px; border:1px solid transparent; transition:all .2s; }
    .header-nav a:hover { color:var(--rojo); border-color:rgba(183,28,28,.2); }
    .header-nav a.active { color:var(--rojo); border-color:rgba(183,28,28,.3); background:rgba(183,28,28,.05); }

    /* STATS */
    .stats-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:rgba(183,28,28,.1); border-bottom:1px solid rgba(183,28,28,.1); }
    .stat-box { background:#fff; padding:18px 20px; text-align:center; }
    .stat-val { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:2px; color:var(--rojo); line-height:1; }
    .stat-lbl { font-size:.5rem; letter-spacing:3px; text-transform:uppercase; color:rgba(30,10,0,.38); margin-top:3px; }

    main { max-width:900px; margin:0 auto; padding:32px 18px 80px; }

    /* TOOLBAR */
    .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .filter-btn { padding:7px 16px; background:#fff; border:1px solid rgba(183,28,28,.15); color:rgba(30,10,0,.45); font-family:'Montserrat',sans-serif; font-size:.58rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .2s; }
    .filter-btn:hover { color:var(--rojo); border-color:rgba(183,28,28,.3); }
    .filter-btn.active { background:rgba(183,28,28,.1); border-color:var(--rojo); color:var(--rojo2); }
    .filter-btn.verde  { border-color:rgba(37,211,102,.3); color:rgba(20,100,40,.6); }
    .filter-btn.verde.active { background:rgba(37,211,102,.1); border-color:#25D366; color:#1a7a3c; }
    .filter-btn.oro    { border-color:rgba(180,130,0,.25); color:rgba(140,100,0,.6); }
    .filter-btn.oro.active { background:rgba(220,170,0,.1); border-color:#a07800; color:#a07800; }

    .search-input { flex:1; min-width:200px; background:#fff; border:1px solid rgba(183,28,28,.15); padding:8px 14px; font-family:'Lora',serif; font-size:.88rem; color:var(--negro); outline:none; border-radius:0; }
    .search-input::placeholder { color:rgba(30,10,0,.28); font-style:italic; }
    .search-input:focus { border-color:var(--rojo); }

    .refresh-btn { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid rgba(183,28,28,.18); color:rgba(139,0,0,.5); font-family:'Montserrat',sans-serif; font-size:.56rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; padding:7px 14px; cursor:pointer; transition:all .2s; }
    .refresh-btn:hover { border-color:var(--rojo); color:var(--rojo); }
    .refresh-btn.spinning svg { animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .results-count { font-size:.56rem; letter-spacing:2px; text-transform:uppercase; color:rgba(30,10,0,.35); margin-left:auto; white-space:nowrap; }

    /* ORDER CARDS */
    .orders-list { display:flex; flex-direction:column; gap:12px; }
    .order-card { background:#fff; border:1px solid rgba(183,28,28,.15); box-shadow:0 2px 8px rgba(0,0,0,.05); position:relative; transition:border-color .2s,box-shadow .2s; }
    .order-card::before { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:rgba(183,28,28,.35); transition:background .2s; }
    .order-card.pendiente { border-color:rgba(183,28,28,.2); }
    .order-card.en_camino { border-color:rgba(37,211,102,.3); }
    .order-card.en_camino::before { background:var(--verde); }
    .order-card.entregado { border-color:rgba(180,140,0,.25); opacity:.75; }
    .order-card.entregado::before { background:#a07800; }

    .order-top { padding:14px 18px 12px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start; }
    .order-nombre { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:1px; color:var(--negro); margin-bottom:3px; }
    .order-pedido { font-family:'Lora',serif; font-style:italic; font-size:.82rem; color:var(--dim-dark); line-height:1.5; margin-bottom:5px; }
    .order-meta { display:flex; gap:14px; flex-wrap:wrap; margin-top:4px; }
    .order-meta span { font-size:.58rem; letter-spacing:1px; color:rgba(30,10,0,.38); display:flex; align-items:center; gap:4px; }
    .order-monto { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:1px; color:var(--rojo); }

    .order-actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
    .badge { display:inline-block; font-size:.5rem; letter-spacing:3px; text-transform:uppercase; padding:4px 10px; font-weight:700; white-space:nowrap; }
    .badge.pendiente { background:rgba(183,28,28,.2); color:rgba(255,100,100,.9); border:1px solid rgba(183,28,28,.4); }
    .badge.en_camino { background:rgba(37,211,102,.1); color:#25D366; border:1px solid rgba(37,211,102,.3); }
    .badge.entregado { background:rgba(255,214,0,.1); color:var(--amarillo); border:1px solid rgba(255,214,0,.3); }

    .btn-estado { padding:7px 14px; font-family:'Montserrat',sans-serif; font-size:.56rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid; }
    .btn-camino  { background:rgba(37,211,102,.1); border-color:rgba(37,211,102,.3); color:#25D366; }
    .btn-camino:hover  { background:rgba(37,211,102,.2); }
    .btn-entregado { background:rgba(255,214,0,.08); border-color:rgba(255,214,0,.25); color:var(--amarillo); }
    .btn-entregado:hover { background:rgba(255,214,0,.16); }
    .btn-estado:disabled { opacity:.35; cursor:not-allowed; }

    .order-bottom { padding:0 18px 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-top:1px solid rgba(183,28,28,.07); padding-top:10px; }
    .btn-link { background:#fff; border:1px solid rgba(183,28,28,.18); color:rgba(139,0,0,.55); font-family:'Montserrat',sans-serif; font-size:.54rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:5px 12px; cursor:pointer; transition:all .2s; }
    .btn-link:hover { border-color:var(--rojo); color:var(--rojo); }
    .btn-link.ok { border-color:#25D366; color:#1a7a3c; }
    .btn-wa-small { background:#25D366; border:none; color:#fff; font-family:'Montserrat',sans-serif; font-size:.54rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:5px 12px; cursor:pointer; transition:background .2s; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
    .btn-wa-small:hover { background:#1da851; }

    .order-id { font-size:.5rem; letter-spacing:1px; color:rgba(30,10,0,.22); font-family:'Montserrat',sans-serif; margin-left:auto; }

    /* EMPTY + LOADING */
    .empty-state { text-align:center; padding:60px 20px; }
    .empty-state p { font-family:'Lora',serif; font-style:italic; font-size:.95rem; color:rgba(30,10,0,.35); }

    /* TOAST */
    .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(16px); background:rgba(255,255,255,.97); border:1px solid rgba(183,28,28,.3); color:var(--rojo2); font-family:'Montserrat',sans-serif; font-size:.62rem; letter-spacing:3px; text-transform:uppercase; padding:11px 26px; opacity:0; pointer-events:none; transition:opacity .3s,transform .3s; z-index:9998; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.12); }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    footer { border-top:1px solid rgba(183,28,28,.12); padding:20px 32px; text-align:center; background:#fff; }
    footer p { font-size:.55rem; letter-spacing:3px; text-transform:uppercase; color:rgba(30,10,0,.3); }

    @media (max-width:600px) {
      header { padding:11px 14px; flex-wrap:wrap; gap:8px; }
      .order-top { grid-template-columns:1fr; }
      .order-actions { flex-direction:row; flex-wrap:wrap; }
    }

    /* PAYMENT CONFIG MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; display:flex; align-items:center; justify-content:center; padding:18px; opacity:0; pointer-events:none; transition:opacity .25s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal-box { background:#fff; border:1px solid rgba(183,28,28,.18); max-width:560px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 16px 48px rgba(0,0,0,.18); animation:slideUp .28s ease; }
    @keyframes slideUp { from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-header { background:var(--rojo); padding:18px 24px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; }
    .modal-title { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:3px; color:#fff; }
    .modal-close { background:none; border:none; color:rgba(255,255,255,.75); font-size:1.4rem; cursor:pointer; line-height:1; padding:2px 6px; transition:color .2s; }
    .modal-close:hover { color:#fff; }
    .modal-body { padding:24px; }
    .cfg-section { margin-bottom:28px; }
    .cfg-section-title { font-size:.52rem; letter-spacing:4px; text-transform:uppercase; color:var(--rojo); font-weight:700; margin-bottom:14px; padding-bottom:6px; border-bottom:1px solid rgba(183,28,28,.12); }
    .cfg-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .cfg-grid.one { grid-template-columns:1fr; }
    .cfg-field { display:flex; flex-direction:column; gap:5px; }
    .cfg-field label { font-size:.52rem; letter-spacing:3px; text-transform:uppercase; color:rgba(30,10,0,.45); font-weight:600; }
    .cfg-field input { background:#fff; border:1px solid rgba(183,28,28,.2); padding:10px 12px; font-family:'Lora',serif; font-size:.9rem; color:var(--negro); outline:none; border-radius:0; transition:border-color .2s; }
    .cfg-field input:focus { border-color:var(--rojo); }
    .cfg-field input::placeholder { color:rgba(30,10,0,.28); font-style:italic; }
    .cfg-toggle { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .cfg-toggle label { font-size:.6rem; letter-spacing:2px; text-transform:uppercase; font-weight:700; color:rgba(30,10,0,.55); cursor:pointer; }
    .cfg-toggle input[type=checkbox] { width:18px; height:18px; accent-color:var(--rojo); cursor:pointer; }
    .cfg-save-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:0 24px 24px; }
    .btn-cfg-save { background:var(--rojo); border:none; color:#fff; font-family:'Montserrat',sans-serif; font-size:.6rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; padding:12px 28px; cursor:pointer; transition:background .2s; }
    .btn-cfg-save:hover { background:var(--rojo2); }
    .btn-cfg-save:disabled { opacity:.5; cursor:not-allowed; }
    .cfg-status { font-size:.58rem; letter-spacing:2px; text-transform:uppercase; color:rgba(30,10,0,.4); }
    .cfg-status.ok { color:#1a7a3c; }
    .cfg-status.err { color:var(--rojo); }
    .btn-cfg-open { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid rgba(183,28,28,.22); color:rgba(139,0,0,.6); font-family:'Montserrat',sans-serif; font-size:.52rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:7px 13px; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .btn-cfg-open:hover { border-color:var(--rojo); color:var(--rojo); }
  </style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <img src="logo.png" alt="Burrito Jack"/>
    <span class="logo-txt">Burrito Jack</span>
  </a>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span class="header-badge">CRM</span>
    <nav class="header-nav" style="display:flex;gap:6px">
      <a href="sender.html">➕ Nuevo</a>
      <a href="crm.html" class="active">📋 CRM</a>
      <a href="mrp.html">📦 MRP</a>
    </nav>
    <button class="btn-cfg-open" onclick="abrirConfig()">⚙️ Métodos de Pago</button>
  </div>
</header>

<!-- MODAL: Configurar Métodos de Pago -->
<div class="modal-overlay" id="modalConfig" onclick="if(event.target===this)cerrarConfig()">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Métodos de Pago</span>
      <button class="modal-close" onclick="cerrarConfig()">✕</button>
    </div>
    <div class="modal-body">

      <!-- SPEI / Transferencia -->
      <div class="cfg-section">
        <div class="cfg-section-title">🏦 Transferencia SPEI</div>
        <div class="cfg-toggle">
          <input type="checkbox" id="spei-activo" checked/>
          <label for="spei-activo">Activar SPEI como opción de pago</label>
        </div>
        <div class="cfg-grid">
          <div class="cfg-field">
            <label>Banco / Institución</label>
            <input id="cfg-banco" type="text" placeholder="Ej. BBVA, Banamex..."/>
          </div>
          <div class="cfg-field">
            <label>Beneficiario (Nombre)</label>
            <input id="cfg-beneficiario" type="text" placeholder="Ej. Juan Pérez García"/>
          </div>
          <div class="cfg-field" style="grid-column:span 2">
            <label>CLABE Interbancaria (18 dígitos)</label>
            <input id="cfg-clabe" type="text" placeholder="Ej. 021850040001234567" maxlength="18"/>
          </div>
        </div>
      </div>

      <!-- Zelle -->
      <div class="cfg-section">
        <div class="cfg-section-title">💲 Zelle (USD)</div>
        <div class="cfg-toggle">
          <input type="checkbox" id="zelle-activo"/>
          <label for="zelle-activo">Activar Zelle como opción de pago</label>
        </div>
        <div class="cfg-grid">
          <div class="cfg-field">
            <label>Nombre en Zelle</label>
            <input id="cfg-zelle-nombre" type="text" placeholder="Nombre del titular"/>
          </div>
          <div class="cfg-field">
            <label>Teléfono / Email Zelle</label>
            <input id="cfg-zelle-tel" type="text" placeholder="Ej. +1 956 272-6415"/>
          </div>
        </div>
      </div>

      <!-- CashApp -->
      <div class="cfg-section">
        <div class="cfg-section-title">💚 CashApp</div>
        <div class="cfg-toggle">
          <input type="checkbox" id="cashapp-activo"/>
          <label for="cashapp-activo">Activar CashApp como opción de pago</label>
        </div>
        <div class="cfg-grid">
          <div class="cfg-field">
            <label>$Cashtag</label>
            <input id="cfg-cashapp-tag" type="text" placeholder="Ej. $burritojack"/>
          </div>
          <div class="cfg-field">
            <label>Link de CashApp</label>
            <input id="cfg-cashapp-link" type="text" placeholder="https://cash.app/..."/>
          </div>
        </div>
      </div>

    </div>
    <div class="cfg-save-row">
      <button class="btn-cfg-save" id="btnGuardarCfg" onclick="guardarConfig()">💾 Guardar Configuración</button>
      <span class="cfg-status" id="cfgStatus"></span>
    </div>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar" id="statsBar">
  <div class="stat-box"><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Total ordenes</div></div>
  <div class="stat-box"><div class="stat-val" id="s-pend"  style="color:#ff6b6b">—</div><div class="stat-lbl">Pendientes</div></div>
  <div class="stat-box"><div class="stat-val" id="s-cam"   style="color:#25D366">—</div><div class="stat-lbl">En camino</div></div>
  <div class="stat-box"><div class="stat-val" id="s-ent"   style="color:var(--amarillo)">—</div><div class="stat-lbl">Entregados</div></div>
  <div class="stat-box"><div class="stat-val" id="s-hoy"   style="color:var(--amarillo2)">—</div><div class="stat-lbl">Ingresos hoy</div></div>
</div>

<main>
  <!-- TOOLBAR -->
  <div class="toolbar">
    <button class="filter-btn active"   id="f-todos"     onclick="setFilter('todos')">Todos</button>
    <button class="filter-btn"          id="f-pendiente" onclick="setFilter('pendiente')">⏳ Pendientes</button>
    <button class="filter-btn verde"    id="f-en_camino" onclick="setFilter('en_camino')">🛵 En camino</button>
    <button class="filter-btn oro"      id="f-entregado" onclick="setFilter('entregado')">✅ Entregados</button>
    <input  class="search-input" id="searchInput" type="text" placeholder="Buscar cliente, pedido..." oninput="renderFiltrado()"/>
    <button class="refresh-btn" id="refreshBtn" onclick="cargarOrdenes()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Actualizar
    </button>
    <span class="results-count" id="resultsCount"></span>
  </div>

  <div id="ordenes-container">
    <div class="empty-state"><p>Cargando pedidos...</p></div>
  </div>
</main>

<footer><p>Burrito Jack · CRM · Reynosa, Tamaulipas</p></footer>
<div class="toast" id="toast"></div>

<script>
  // ════════════════════════════════════
  //  CONFIGURACIÓN
  // ════════════════════════════════════
  var GAS_URL      = 'https://script.google.com/macros/s/AKfycbz4syNWO1BspRufcbDv3x0uWvWuI7Rts3YUtf8hvN3OWWMRh3OS5sOwhAZwZp56vZ1yzQ/exec';
  var RECEIVER_URL = 'https://horussystemco.com/burritojack/receiver';
  var WA_NUMBER    = '528992466943';
  var ADMIN_KEY    = 'burritojack2025';
  // ════════════════════════════════════

  var todasOrdenes = [];
  var filtroActivo = 'todos';

  // ── Cargar ordenes ────────────────────────────────
  async function cargarOrdenes() {
    var btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    document.getElementById('ordenes-container').innerHTML = '<div class="empty-state"><p>Cargando...</p></div>';

    try {
      var data = await callGAS({ action:'listarOrdenes', adminKey: ADMIN_KEY });
      if (!data.ok) throw new Error(data.error);
      todasOrdenes = data.ordenes || [];
      actualizarStats();
      renderFiltrado();
    } catch(err) {
      document.getElementById('ordenes-container').innerHTML = '<div class="empty-state"><p>Error al cargar: ' + esc(err.message) + '</p></div>';
    } finally {
      btn.classList.remove('spinning');
    }
  }

  function actualizarStats() {
    var hoy   = new Date().toISOString().slice(0,10);
    var pend  = todasOrdenes.filter(function(o) { return o.estado === 'pendiente'; }).length;
    var cam   = todasOrdenes.filter(function(o) { return o.estado === 'en_camino'; }).length;
    var ent   = todasOrdenes.filter(function(o) { return o.estado === 'entregado'; }).length;
    var ingHoy = 0;
    todasOrdenes.forEach(function(o) {
      if (String(o.timestamp).slice(0,10) === hoy) {
        ingHoy += parseFloat(String(o.monto).replace(/[^0-9.]/g,'')) || 0;
      }
    });
    document.getElementById('s-total').textContent = todasOrdenes.length;
    document.getElementById('s-pend').textContent  = pend;
    document.getElementById('s-cam').textContent   = cam;
    document.getElementById('s-ent').textContent   = ent;
    document.getElementById('s-hoy').textContent   = '$' + ingHoy.toLocaleString('es-MX');
  }

  function setFilter(f) {
    filtroActivo = f;
    ['todos','pendiente','en_camino','entregado'].forEach(function(k) {
      document.getElementById('f-' + k).classList.toggle('active', k === f);
    });
    renderFiltrado();
  }

  function renderFiltrado() {
    var q = (document.getElementById('searchInput').value || '').toLowerCase();
    var filtered = todasOrdenes.filter(function(o) {
      if (filtroActivo !== 'todos' && o.estado !== filtroActivo) return false;
      if (q) {
        var hay = (o.cliente + o.pedido + o.telefono + o.id).toLowerCase().indexOf(q) !== -1;
        if (!hay) return false;
      }
      return true;
    });
    document.getElementById('resultsCount').textContent = filtered.length + ' resultado' + (filtered.length !== 1 ? 's' : '');
    renderOrdenes(filtered);
  }

  function renderOrdenes(ordenes) {
    var container = document.getElementById('ordenes-container');
    if (!ordenes.length) {
      container.innerHTML = '<div class="empty-state"><p>No hay pedidos con estos filtros.<br/>¡Buenas noticias o ajusta los filtros!</p></div>';
      return;
    }

    var html = '<div class="orders-list">';
    ordenes.forEach(function(o) {
      var estado   = o.estado || 'pendiente';
      var ts       = o.timestamp ? new Date(o.timestamp).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
      var link     = RECEIVER_URL + '?id=' + encodeURIComponent(o.id);
      var msgWA    = encodeURIComponent('🌯 *Burrito Jack*\n\nHola ' + (o.cliente||'') + ', tu pedido ya va en camino! 🛵\n\n📋 *Pedido:* ' + (o.pedido||'') + '\n\n🔗 *Rastrea tu pedido aquí:*\n' + link + '\n\n¡Gracias por tu preferencia! 🤙');

      html += '<div class="order-card ' + estado + '" id="ord-' + o.id + '">';
      html += '<div class="order-top">';
      html += '<div>';
      html += '<div class="order-nombre">' + esc(o.cliente) + '</div>';
      html += '<div class="order-pedido">' + esc(o.pedido) + '</div>';
      html += '<div class="order-meta">';
      html += '<span>🕐 ' + ts + '</span>';
      if (o.telefono) html += '<span>📱 ' + esc(o.telefono) + '</span>';
      if (o.direccion && o.direccion !== 'Pasa a recoger') html += '<span>📍 ' + esc(o.direccion) + '</span>';
      if (o.metodoPago) html += '<span>💳 ' + (o.metodoPago === 'efectivo' ? 'Efectivo' : 'SPEI') + '</span>';
      html += '</div>';
      if (o.notas && o.notas !== 'Creado desde sender') html += '<div style="margin-top:4px;font-family:\'Lora\',serif;font-style:italic;font-size:.76rem;color:rgba(255,248,225,.3)">📝 ' + esc(o.notas) + '</div>';
      html += '</div>';

      html += '<div class="order-actions">';
      html += '<div class="order-monto">' + esc(o.monto) + '</div>';
      html += '<span class="badge ' + estado + '">' + estadoLabel(estado) + '</span>';
      if (estado === 'pendiente') {
        html += '<button class="btn-estado btn-camino" onclick="cambiarEstado(\'' + o.id + '\',\'en_camino\')">🛵 En camino</button>';
      }
      if (estado === 'en_camino') {
        html += '<button class="btn-estado btn-entregado" onclick="cambiarEstado(\'' + o.id + '\',\'entregado\')">✅ Entregado</button>';
      }
      html += '</div>';
      html += '</div>';

      html += '<div class="order-bottom">';
      html += '<button class="btn-link" onclick="copiarLinkOrden(\'' + encodeURIComponent(link) + '\',this)">Copiar link</button>';
      if (o.telefono) {
        var waNum = String(o.telefono).replace(/[^0-9]/g,'');
        html += '<a class="btn-wa-small" href="https://wa.me/' + waNum + '?text=' + encodeURIComponent(msgWA) + '" target="_blank"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> WA Cliente</a>';
      }
      html += '<span class="order-id">' + esc(o.id) + '</span>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  async function cambiarEstado(id, nuevoEstado) {
    var card = document.getElementById('ord-' + id);
    var btns = card ? card.querySelectorAll('.btn-estado') : [];
    btns.forEach(function(b) { b.disabled = true; b.textContent = 'Guardando...'; });

    try {
      var data = await callGAS({ action:'updateEstado', id: id, estado: nuevoEstado, adminKey: ADMIN_KEY });
      if (!data.ok) throw new Error(data.error);
      toast('✓ Estado actualizado: ' + estadoLabel(nuevoEstado));
      await cargarOrdenes();
    } catch(err) {
      toast('Error: ' + err.message);
      btns.forEach(function(b) { b.disabled = false; b.textContent = nuevoEstado === 'en_camino' ? '🛵 En camino' : '✅ Entregado'; });
    }
  }

  function copiarLinkOrden(encodedLink, btn) {
    var link = decodeURIComponent(encodedLink);
    navigator.clipboard.writeText(link).then(function() {
      var orig = btn.textContent;
      btn.textContent = '✓ Copiado'; btn.classList.add('ok');
      toast('Link copiado');
      setTimeout(function() { btn.textContent = orig; btn.classList.remove('ok'); }, 2200);
    });
  }

  function estadoLabel(e) {
    return { pendiente:'⏳ Pendiente', en_camino:'🛵 En camino', entregado:'✅ Entregado' }[e] || e;
  }

  // ── JSONP ──────────────────────────────────────────
  function callGAS(params) {
    return new Promise(function(resolve, reject) {
      var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
      var qs = Object.keys(params).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(String(params[k]));
      }).join('&') + '&callback=' + encodeURIComponent(cbName);
      var script = document.createElement('script');
      var timer  = setTimeout(function() { cleanup(); reject(new Error('Timeout')); }, 15000);
      window[cbName] = function(d) { cleanup(); resolve(d); };
      function cleanup() { clearTimeout(timer); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
      script.onerror = function() { cleanup(); reject(new Error('Sin conexión')); };
      script.src = GAS_URL + '?' + qs;
      document.head.appendChild(script);
    });
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var toastT;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function() { t.classList.remove('show'); }, 2600);
  }

  // Auto-refresh cada 60 segundos
  cargarOrdenes();
  setInterval(function() {
    if (document.visibilityState === 'visible') cargarOrdenes();
  }, 60000);

  // ════════════════════════════════════
  //  CONFIGURACIÓN MÉTODOS DE PAGO
  // ════════════════════════════════════

  function abrirConfig() {
    document.getElementById('modalConfig').classList.add('open');
    cargarConfig();
  }

  function cerrarConfig() {
    document.getElementById('modalConfig').classList.remove('open');
  }

  function setField(id, val) {
    var el = document.getElementById(id);
    if (el) el.value = val || '';
  }

  function setCheck(id, val) {
    var el = document.getElementById(id);
    if (el) el.checked = !!val;
  }

  function getField(id) { return (document.getElementById(id) || {}).value || ''; }
  function getCheck(id) { return !!(document.getElementById(id) || {}).checked; }

  async function cargarConfig() {
    var statusEl = document.getElementById('cfgStatus');
    statusEl.textContent = 'Cargando...';
    statusEl.className   = 'cfg-status';
    try {
      // Intentar cargar desde GAS primero
      var data = await callGAS({ action:'getConfig', key:'metodosPago', adminKey: ADMIN_KEY });
      if (data.ok && data.value) {
        var cfg = JSON.parse(data.value);
        aplicarConfig(cfg);
        statusEl.textContent = '✓ Configuración cargada';
        statusEl.className   = 'cfg-status ok';
        setTimeout(function() { statusEl.textContent = ''; }, 2500);
        return;
      }
    } catch(e) {}
    // Fallback: localStorage
    var local = localStorage.getItem('bj_metodosPago');
    if (local) {
      try { aplicarConfig(JSON.parse(local)); } catch(e) {}
    }
    statusEl.textContent = '';
  }

  function aplicarConfig(cfg) {
    if (!cfg) return;
    setCheck('spei-activo',       cfg.speiActivo !== false);
    setField('cfg-banco',         cfg.banco);
    setField('cfg-beneficiario',  cfg.beneficiario);
    setField('cfg-clabe',         cfg.clabe);
    setCheck('zelle-activo',      cfg.zelleActivo);
    setField('cfg-zelle-nombre',  cfg.zelleNombre);
    setField('cfg-zelle-tel',     cfg.zelleTel);
    setCheck('cashapp-activo',    cfg.cashappActivo);
    setField('cfg-cashapp-tag',   cfg.cashappTag);
    setField('cfg-cashapp-link',  cfg.cashappLink);
  }

  function leerFormularioCfg() {
    return {
      speiActivo:   getCheck('spei-activo'),
      banco:        getField('cfg-banco'),
      beneficiario: getField('cfg-beneficiario'),
      clabe:        getField('cfg-clabe'),
      zelleActivo:  getCheck('zelle-activo'),
      zelleNombre:  getField('cfg-zelle-nombre'),
      zelleTel:     getField('cfg-zelle-tel'),
      cashappActivo:getCheck('cashapp-activo'),
      cashappTag:   getField('cfg-cashapp-tag'),
      cashappLink:  getField('cfg-cashapp-link')
    };
  }

  async function guardarConfig() {
    var btn      = document.getElementById('btnGuardarCfg');
    var statusEl = document.getElementById('cfgStatus');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    statusEl.textContent = '';
    statusEl.className   = 'cfg-status';

    var cfg    = leerFormularioCfg();
    var cfgStr = JSON.stringify(cfg);

    // Guardar en localStorage como respaldo inmediato
    localStorage.setItem('bj_metodosPago', cfgStr);

    try {
      var data = await callGAS({ action:'saveConfig', key:'metodosPago', value: cfgStr, adminKey: ADMIN_KEY });
      if (!data.ok) throw new Error(data.error || 'Error GAS');
      statusEl.textContent = '✓ Guardado en la nube';
      statusEl.className   = 'cfg-status ok';
      toast('✓ Configuración de pagos guardada');
    } catch(e) {
      statusEl.textContent = '⚠ Solo local: ' + e.message;
      statusEl.className   = 'cfg-status err';
      toast('⚠ Guardado solo local (sin conexión)');
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Guardar Configuración';
    }
  }

  // Cerrar modal con Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') cerrarConfig();
  });
</script>
