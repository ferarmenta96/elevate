// ── HELPERS ───────────────────────────────────────────────────────────
function chips(options, field, multi=false) {
  return options.map(o => {
    const v = typeof o==="object" ? o.value : o;
    const l = typeof o==="object" ? o.label : o;
    const isArr = Array.isArray(form[field]);
    const sel = isArr ? form[field].includes(v) : form[field]===v;
    // Usamos data-* para evitar que caracteres especiales rompan el onclick
    const safeVal = v.replace(/'/g, "&#39;");
    return `<button type="button" class="chip ${multi?'':'radio'} ${sel?'selected':''}"
      data-field="${field}" data-value="${safeVal}" data-multi="${multi}"
      onclick="handleChip(this)">${l}</button>`;
  }).join("");
}

function handleChip(btn) {
  const field = btn.dataset.field;
  const value = btn.dataset.value;
  const multi = btn.dataset.multi === "true";
  if(multi) {
    const arr = form[field];
    const idx = arr.indexOf(value);
    if(idx>-1) arr.splice(idx,1); else arr.push(value);
  } else {
    form[field] = value;
  }
  renderStep();
}

function val(field) { return form[field] || ""; }

function input(label, field, placeholder, req=false) {
  return `<div class="field fade-up">
    <label>${label}${req?'<span class="req"> *</span>':''}</label>
    <input type="text" value="${val(field).replace(/"/g,'&quot;')}" placeholder="${placeholder}"
      oninput="form['${field}']=this.value">
  </div>`;
}

function select(label, field, options, req=false) {
  const opts = options.map(o => {
    const v=typeof o==="object"?o.value:o, l=typeof o==="object"?o.label:o;
    return `<option value="${v}" ${form[field]===v?"selected":""}>${l}</option>`;
  }).join("");
  return `<div class="field fade-up">
    <label>${label}${req?'<span class="req"> *</span>':''}</label>
    <select onchange="form['${field}']=this.value;renderStep()">
      <option value="" disabled ${!form[field]?"selected":""}>Seleccionar...</option>
      ${opts}
    </select>
  </div>`;
}

function textarea(label, field, placeholder) {
  return `<div class="field fade-up">
    <label>${label}</label>
    <textarea placeholder="${placeholder}" oninput="form['${field}']=this.value">${val(field)}</textarea>
  </div>`;
}

function chipGroup(label, field, options, multi=false) {
  return `<div class="field fade-up">
    <label>${label}</label>
    <div class="chip-group">${chips(options,field,multi)}</div>
  </div>`;
}

// ── NAVIGATION ────────────────────────────────────────────────────────
function canProceed() {
  if(currentStep===0) return form.empresa.trim() && form.industria;
  if(currentStep===5) return form.objetivo.trim().length>10;
  return true;
}

function renderStep() {
  const content = document.getElementById("stepContent");
  content.innerHTML = getStepHTML(currentStep);

  // Step nav
  const nav = document.getElementById("stepNav");
  nav.innerHTML = STEPS.map((s,i) => {
    const done = i<currentStep, active = i===currentStep;
    return `<div class="step-item">
      <div class="step-dot ${done?"done":""} ${active?"active":""}">${done?"✓":i+1}</div>
      <div class="step-label ${active?"active":""}">${s}</div>
    </div>${i<STEPS.length-1?`<div class="step-connector ${i<currentStep?"done":""}"></div>`:""}`;
  }).join("");

  // Progress
  const pct = Math.round(((currentStep+1)/6)*100);
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressLabel").textContent = `Paso ${currentStep+1} de 6 · ${pct}% completado`;

  // Buttons
  const btnBack = document.getElementById("btnBack");
  const btnNext = document.getElementById("btnNext");
  const btnRow = document.getElementById("btnRow");

  if(currentStep===6) {
    btnRow.style.display = "none";
  } else {
    btnRow.style.display = "flex";
    btnBack.style.display = currentStep>0 ? "block" : "none";
    btnNext.disabled = !canProceed();
    btnNext.textContent = currentStep===5 ? "✨ Analizar con IA →" : "Continuar →";
  }

  // Progress & step nav visible
  document.getElementById("progressWrap").style.display = currentStep===6 ? "none" : "block";
  document.getElementById("stepNav").style.display = currentStep===6 ? "none" : "flex";
  document.getElementById("heroSection").style.display = currentStep>0 ? "none" : "block";

  document.getElementById("errorBox").style.display = "none";
}

function showError(msg) {
  const box = document.getElementById("errorBox");
  document.getElementById("errorMsg").textContent = msg;
  box.style.display = "block";
  box.scrollIntoView({behavior:"smooth",block:"center"});
}

async function nextStep() {
  if(!canProceed()) return;
  if(currentStep===5) {
    await submitForm();
  } else {
    currentStep++;
    renderStep();
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

function prevStep() {
  if(currentStep>0) { currentStep--; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }
}

// ── SUBMIT ────────────────────────────────────────────────────────────
async function submitForm() {
  currentStep = 6;
  renderStep(); // muestra spinner
  window.scrollTo({top:0,behavior:"smooth"});

  try {
    const payload = encodeURIComponent(JSON.stringify({ action: "analyze", data: form }));
    const resp = await fetch(APPS_SCRIPT_URL + "?payload=" + payload, {
      method: "GET",
      redirect: "follow"
    });

    if(!resp.ok) throw new Error(`Error HTTP ${resp.status}`);
    const result = await resp.json();

    if(!result.success) throw new Error(result.error || "Error desconocido");

    analysisResult = result.analysis;
    clientId = result.clientId;
    renderStep();
    window.scrollTo({top:0,behavior:"smooth"});

  } catch(e) {
    currentStep = 5;
    renderStep();
    showError("Error al conectar con el servidor. Verifica tu conexión e intenta de nuevo. Detalle: " + e.message);
  }
}
