<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GALAX-IX — Horus Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Barlow+Condensed:wght@400;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-cyan: #00ffff;
    --neon-pink: #ff00aa;
    --neon-yellow: #ffff00;
    --dark-bg: #02040a;
    --gold: #C9A84C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: var(--dark-bg); 
    color: white; 
    font-family: 'Press Start 2P', cursive;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* El juego ocupa el espacio restante */
  #gameContainer {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  
  canvas { display: block; width: 100%; height: 100%; }

  /* Ajustes de UI para que no choquen con los anuncios */
  #ui { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 10px; pointer-events: none; }
  .hud-box { background: rgba(0,0,0,0.7); border: 1px solid var(--neon-cyan); padding: 5px; font-size: 7px; color: var(--neon-cyan); }

  /* SECCIÓN DE PUBLICIDAD (Inferior) */
  #adsContainer {
    height: 120px; /* Un poco más pequeño para mobile */
    background: #000;
    border-top: 2px solid var(--gold);
    position: relative;
    z-index: 100;
  }

  /* Copiamos los estilos de los banners del index original */
  .ad-banner { height: 100%; width: 100%; position: relative; overflow: hidden; cursor: pointer; }
  .ad-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s; display: flex; align-items: stretch; }
  .ad-slide.active { opacity: 1; }
  
  /* Slide 0: Horus */
  .ad-slide-0 { background: linear-gradient(135deg, #0d0b08 0%, #1c1508 100%); }
  .ad-s0-brand { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--gold); letter-spacing: 5px; text-transform: uppercase; }
  .ad-s0-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; color: #6b6459; text-transform: uppercase; letter-spacing: 2px; }
  
  /* Estilos rápidos para textos de anuncios en el juego */
  .ad-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 20px; }
  .ad-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: #fff; margin-bottom: 5px; }
  .ad-pill { display: inline-block; background: var(--gold); color: #000; font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 3px; width: fit-content; }

  .ad-indicators { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  .ad-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .ad-dot.active { background: var(--gold); width: 12px; border-radius: 2px; }

  /* Botón volver */
  #backBtn {
    position: absolute;
    top: 50px;
    left: 10px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid #fff;
    font-family: 'Barlow Condensed', sans-serif;
    padding: 5px 10px;
    text-decoration: none;
    font-size: 10px;
    z-index: 1000;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <a href="index.html" id="backBtn">← VOLVER AL MAPA</a>
  
  <div id="ui">
    <div class="hud-box">SCORE<br><span id="scoreDisplay">000000</span></div>
    <div class="hud-box" style="text-align:right">LIVES<br><span id="livesDisplay">♥ ♥ ♥</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <div id="overlay" style="position:absolute; inset:0; background:rgba(0,0,0,0.8); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50;">
    <h1 style="color:var(--neon-cyan); margin-bottom:20px; font-size: 20px;">GALAX-IX</h1>
    <button id="startBtn" style="background:transparent; border:2px solid var(--neon-cyan); color:var(--neon-cyan); padding:15px; font-family:'Press Start 2P'; cursor:pointer;">EMPEZAR</button>
  </div>
</div>

<div id="adsContainer">
  <div class="ad-banner">
    <div class="ad-slide ad-slide-0 active" id="adSlide0">
      <div class="ad-content">
        <div class="ad-s0-brand">HORUS</div>
        <div class="ad-s0-sub">Automatización Empresarial</div>
      </div>
    </div>
    <div class="ad-slide" id="adSlide1" style="background:#f5f0e8">
      <div class="ad-content">
        <div class="ad-title" style="color:#000">¿Vendes poco?</div>
        <div class="ad-pill">Sistemas Horus</div>
      </div>
    </div>
    <div class="ad-slide" id="adSlide2" style="background:#060a10">
      <div class="ad-content">
        <div class="ad-title">Tu App Realidad</div>
        <div class="ad-pill" style="background:#60a5fa">Cotizar</div>
      </div>
    </div>
    
    <div class="ad-indicators">
      <div class="ad-dot active" id="adDot0"></div>
      <div class="ad-dot" id="adDot1"></div>
      <div class="ad-dot" id="adDot2"></div>
    </div>
  </div>
</div>

<script>
// --- Lógica de Banners (Igual que en el index) ---
let adIndex = 0;
setInterval(() => {
  adIndex = (adIndex + 1) % 3;
  for(let i=0; i<3; i++) {
    document.getElementById('adSlide'+i).classList.toggle('active', i === adIndex);
    document.getElementById('adDot'+i).classList.toggle('active', i === adIndex);
  }
}, 5000);

// --- Lógica del Juego Adaptada ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const container = document.getElementById('gameContainer');
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// [AQUÍ PEGA TODO TU CÓDIGO JAVASCRIPT DEL JUEGO ORIGINAL]
// Solo asegúrate de usar la variable 'W' y 'H' que definimos arriba
// para que el juego sepa que su límite es el contenedor y no toda la pantalla.
</script>
</body>
</html>
