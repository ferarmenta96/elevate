<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GALAX-IX — Horus Arcade</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cormorant+Garamond:wght@600;700&family=Barlow+Condensed:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-cyan: #00ffff;
      --neon-pink: #ff00aa;
      --gold: #C9A84C;
      --dark-bg: #02040a;
      --muted: #6b6459;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark-bg);
      font-family: 'Press Start 2P', cursive;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: white;
    }

    #gameWrapper {
      flex: 1;
      position: relative;
      width: 100%;
      background: #000;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* --- ESTILOS DE BANNERS HORUS --- */
    #adsFooter {
      height: 125px;
      background: #000;
      border-top: 1px solid var(--gold);
      position: relative;
      flex-shrink: 0;
    }

    .ad-banner { width: 100%; height: 100%; position: relative; overflow: hidden; }
    .ad-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s ease; display: flex; align-items: stretch; }
    .ad-slide.active { opacity: 1; }

    .ad-slide-0 { background: linear-gradient(135deg, #0d0b08 0%, #1c1508 55%, #0d0b08 100%); }
    .ad-slide-1 { background: linear-gradient(135deg, #f5f0e8 0%, #ede5d4 100%); }
    .ad-slide-2 { background: linear-gradient(135deg, #060a10 0%, #0b1220 55%, #060a10 100%); }
    .ad-slide-3 { background: linear-gradient(135deg, #C9A84C 0%, #E2C46D 50%, #C9A84C 100%); }

    .ad-left { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 20px; }
    .ad-brand { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--gold); letter-spacing: 4px; text-transform: uppercase; }
    .ad-headline { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700; color: #1a1408; margin: 5px 0; }
    .on-dark .ad-headline { color: #ddeeff; }
    
    .ad-indicators { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
    .ad-dot { width: 6px; height: 6px; border-radius: 50%; transition: 0.3s; }
    .ad-dot.on-dark { background: rgba(255,255,255,0.2); }
    .ad-dot.on-light { background: rgba(0,0,0,0.2); }
    .ad-dot.active.on-dark { width: 18px; border-radius: 3px; background: white; }
    .ad-dot.active.on-light { width: 18px; border-radius: 3px; background: black; }

    /* --- UI JUEGO --- */
    #ui { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 10px; pointer-events: none; }
    .hud-box { background: rgba(0,0,0,0.7); border: 1px solid var(--neon-cyan); padding: 5px; font-size: 8px; color: var(--neon-cyan); }
    #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
    #startBtn { background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan); font-family: 'Press Start 2P'; padding: 15px 25px; cursor: pointer; }
    #backBtn { position: absolute; top: 55px; left: 10px; color: var(--muted); font-size: 8px; text-decoration: none; border: 1px solid var(--muted); padding: 4px; z-index: 30; }

    /* Controles Mobile */
    #controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
    .btn-ctrl { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--neon-cyan); background: rgba(0,0,0,0.5); color: var(--neon-cyan); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .btn-fire { border-color: var(--neon-pink); color: var(--neon-pink); width: 70px; height: 70px; }
  </style>
</head>
<body>

  <div id="gameWrapper">
    <a href="index.html" id="backBtn">← VOLVER</a>
    <div id="ui">
      <div class="hud-box">SCORE<br><span id="scoreDisplay">000000</span></div>
      <div class="hud-box" style="text-align:right">LIVES<br><span id="livesDisplay">♥ ♥ ♥</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
      <div style="display:flex; gap:10px;">
        <div class="btn-ctrl" id="btnLeft">◀</div>
        <div class="btn-ctrl" id="btnRight">▶</div>
      </div>
      <div class="btn-ctrl btn-fire" id="btnFire">✦</div>
    </div>
    
    <div id="overlay">
      <h1 style="color:var(--neon-cyan); font-size:16px; margin-bottom:25px;">GALAX-IX</h1>
      <button id="startBtn">START GAME</button>
    </div>
  </div>

  <div id="adsFooter">
    <div class="ad-banner">
      <div class="ad-slide ad-slide-0 active" id="adSlide0"><div class="ad-left"><div class="ad-brand">HORUS</div></div></div>
      <div class="ad-slide ad-slide-1" id="adSlide1"><div class="ad-left"><div class="ad-headline">Automatiza tu negocio.</div></div></div>
      <div class="ad-slide ad-slide-2 on-dark" id="adSlide2"><div class="ad-left"><div class="ad-headline">Desarrollo Digital.</div></div></div>
      <div class="ad-slide ad-slide-3" id="adSlide3"><div class="ad-left"><div class="ad-headline">Anúnciate aquí.</div></div></div>
      <div class="ad-indicators" id="adDotsContainer"></div>
    </div>
  </div>

<script>
// --- LÓGICA BANNERS ---
const AD_COUNT = 4;
const AD_TYPES = ['on-dark', 'on-light', 'on-dark', 'on-light'];
let adIndex = 0;

function updateAds() {
  const container = document.getElementById('adDotsContainer');
  container.innerHTML = Array.from({length:AD_COUNT}, (_,i) => `<div class="ad-dot ${AD_TYPES[adIndex]} ${i===adIndex?'active':''}"></div>`).join('');
  for(let i=0; i<AD_COUNT; i++) document.getElementById(`adSlide${i}`).classList.toggle('active', i===adIndex);
  adIndex = (adIndex + 1) % AD_COUNT;
}
setInterval(updateAds, 5000); updateAds();

// --- LÓGICA JUEGO ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, scale, player, enemies = [], bullets = [], enemyBullets = [], particles = [], score = 0, lives = 3, playing = false;

function resize() {
  W = canvas.width = document.getElementById('gameWrapper').clientWidth;
  H = canvas.height = document.getElementById('gameWrapper').clientHeight;
  scale = Math.min(W, H) / 400;
}
window.addEventListener('resize', resize); resize();

function init() {
  player = { x: W/2, y: H-80*scale, w: 30*scale, h: 25*scale, speed: 250*scale };
  enemies = []; bullets = []; enemyBullets = []; score = 0; lives = 3;
  spawnWave();
}

function spawnWave() {
  for(let r=0; r<3; r++) {
    for(let c=0; c<6; c++) {
      enemies.push({ x: 50*scale + c*50*scale, y: 50*scale + r*40*scale, w: 25*scale, h: 20*scale, vx: 40*scale });
    }
  }
}

function update(dt) {
  if(!playing) return;
  // Movimiento enemigos
  let edge = false;
  enemies.forEach(e => {
    e.x += e.vx * dt;
    if(e.x > W-e.w || e.x < 0) edge = true;
  });
  if(edge) enemies.forEach(e => { e.vx *= -1; e.y += 10*scale; });

  // Balas
  bullets.forEach((b, i) => {
    b.y -= 400*scale*dt;
    if(b.y < 0) bullets.splice(i, 1);
    enemies.forEach((e, ei) => {
      if(b.x > e.x && b.x < e.x+e.w && b.y > e.y && b.y < e.y+e.h) {
        bullets.splice(i, 1); enemies.splice(ei, 1); score += 100;
        document.getElementById('scoreDisplay').innerText = score.toString().padStart(6,'0');
      }
    });
  });

  if(enemies.length === 0) spawnWave();
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  if(!playing) return;
  
  // Jugador
  ctx.fillStyle = '#00ffff'; ctx.fillRect(player.x, player.y, player.w, player.h);
  // Enemigos
  ctx.fillStyle = '#ff00aa'; enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));
  // Balas
  ctx.fillStyle = '#ffff00'; bullets.forEach(b => ctx.fillRect(b.x, b.y, 4*scale, 10*scale));
}

let last = 0;
function loop(ms) {
  const dt = (ms - last) / 1000; last = ms;
  update(dt); draw(); requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = () => {
  document.getElementById('overlay').style.display = 'none';
  playing = true; init(); requestAnimationFrame(loop);
};

// Controles Táctiles
let move = 0;
document.getElementById('btnLeft').ontouchstart = () => move = -1;
document.getElementById('btnRight').ontouchstart = () => move = 1;
document.getElementById('btnLeft').ontouchend = document.getElementById('btnRight').ontouchend = () => move = 0;
document.getElementById('btnFire').ontouchstart = () => { if(playing) bullets.push({x: player.x+player.w/2, y: player.y}); };

setInterval(() => { if(playing && move !== 0) player.x = Math.max(0, Math.min(W-player.w, player.x + move*player.speed*0.016)); }, 16);
</script>
</body>
</html>
