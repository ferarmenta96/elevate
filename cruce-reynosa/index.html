<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Tiempo real de espera en los puentes internacionales de Reynosa, Tamaulipas" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cruce Reynosa" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta property="og:title" content="Cruce Reynosa 🌉" />
  <meta property="og:description" content="¿Cuánto está la fila en el puente? Tiempo real, reportado por la comunidad." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://raw.githubusercontent.com/TU_USUARIO/cruce-reynosa/main/public/og-image.png" />

  <title>Cruce Reynosa 🌉</title>
  <link rel="manifest" href="/cruce-reynosa/manifest.json" />
  <link rel="apple-touch-icon" href="/cruce-reynosa/public/icon-192.png" />
  <link rel="icon" type="image/png" href="/cruce-reynosa/public/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #0f0f0f;
      --surface2: #161616;
      --surface3: #1e1e1e;
      --border: #242424;
      --border-gold: #C9A84C40;
      --text: #f0ede8;
      --text-dim: #b0a99a;
      --muted: #6b6459;
      --faint: #3a3530;
      /* Horus Gold */
      --gold: #C9A84C;
      --gold-bright: #E2C46D;
      --gold-dim: #8a7035;
      --gold-glow: #C9A84C20;
      --gold-glow-strong: #C9A84C40;
      /* Status colors */
      --green: #4ade80;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      /* Bridge accents — kept as variables, overridden per bridge */
      --accent: var(--gold);
      --accent-glow: var(--gold-glow);
      --accent-transparent: var(--gold-glow-strong);
      --tab-color: var(--gold);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      height: 100%;
      overflow: hidden;
    }

    /* ── SPLASH SCREEN ──────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #splash.hidden {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-eye {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: splashPulse 2s ease-in-out infinite;
    }

    @keyframes splashPulse {
      0%, 100% { filter: drop-shadow(0 0 8px #C9A84C60); }
      50% { filter: drop-shadow(0 0 24px #C9A84C90); }
    }

    .splash-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 8px;
      color: var(--gold);
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 4px;
    }
    .splash-tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .splash-divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin-bottom: 24px;
    }
    .splash-app-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text);
      text-transform: uppercase;
    }
    .splash-app-sub {
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .splash-loading {
      position: absolute;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .splash-bar {
      width: 120px;
      height: 1px;
      background: var(--faint);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }
    .splash-bar-fill {
      height: 100%;
      background: var(--gold);
      animation: splashLoad 1.6s ease forwards;
      width: 0;
    }
    @keyframes splashLoad {
      0% { width: 0 }
      60% { width: 80% }
      100% { width: 100% }
    }
    .splash-loading-text {
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── APP ────────────────────────────────────── */
    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px 0;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    /* Gold top line */
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Horus Eye SVG logo */
    .logo-eye {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .logo-text { }

    .logo-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--gold);
      text-transform: uppercase;
    }

    .logo-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #4ade8015;
      border: 1px solid #4ade8030;
      border-radius: 20px;
      padding: 5px 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      color: var(--green);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 5px; height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── BRIDGE TABS ─────────────────────────────── */
    .bridge-tabs {
      display: flex;
      gap: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .bridge-tabs::-webkit-scrollbar { display: none; }

    .bridge-tab {
      flex-shrink: 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 12px 11px;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .bridge-tab.active {
      color: var(--tab-color);
      border-bottom-color: var(--tab-color);
    }

    /* ── SCROLLABLE CONTENT ──────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 100px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── STATUS HERO ─────────────────────────────── */
    .status-hero {
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--accent-transparent);
    }
    .status-hero::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: var(--accent-glow);
      pointer-events: none;
    }
    /* Horus-style corner accent */
    .status-hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 60px; height: 1px;
      background: var(--accent-transparent);
    }

    .status-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .status-time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 44px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .status-no-reports {
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
      font-style: italic;
    }

    .status-meta {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .status-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ── REPORT BUTTON ───────────────────────────── */
    .report-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold-dim) 0%, var(--gold) 100%);
      color: #080808;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 24px #C9A84C30;
      margin-bottom: 18px;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
    }
    .report-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 12px #C9A84C20;
    }

    /* ── SECTION TITLE ───────────────────────────── */
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── TIPS BOX ────────────────────────────────── */
    .tips-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .tips-box ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tips-box li {
      font-size: 13px;
      color: var(--text-dim);
      padding-left: 14px;
      position: relative;
      line-height: 1.4;
    }
    .tips-box li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 11px;
    }

    /* ── REPORT CARDS ────────────────────────────── */
    .report-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .report-card:hover { border-color: var(--border-gold); }

    .report-pos {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }
    .report-lane {
      font-size: 12px;
      color: var(--muted);
    }
    .report-note {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 5px;
      font-style: italic;
    }
    .report-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .wait-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 20px;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .report-ago {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── EMPTY STATE ─────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }
    .empty-state .emoji { font-size: 40px; margin-bottom: 10px; }
    .empty-state .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .empty-state .sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── BOTTOM BAR ──────────────────────────────── */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'Barlow', sans-serif;
      flex-shrink: 0;
    }

    /* ── POWERED BY HORUS ────────────────────────── */
    .powered-by {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 36px;
      background: #0a0a0a;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .powered-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .powered-logo {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .powered-horus {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
    }

    /* ── BOTTOM NAV ──────────────────────────────── */
    .bottom-nav {
      position: absolute;
      bottom: 36px; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'Barlow', sans-serif;
    }

    /* ── INSTALL BANNER ──────────────────────────── */
    .install-banner {
      position: absolute;
      bottom: 80px;
      left: 12px; right: 12px;
      background: var(--surface2);
      border: 1px solid var(--gold-glow-strong);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px #00000060;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .install-banner-text { flex: 1; }
    .install-banner-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .install-banner-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .install-btn {
      background: var(--gold);
      color: #080808;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .install-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      z-index: 100;
    }
    .modal-sheet {
      background: var(--surface);
      border-top: 1px solid var(--border-gold);
      border-radius: 20px 20px 0 0;
      padding: 16px 20px 40px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: sheetUp 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-handle {
      width: 36px; height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }
    .modal-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }
    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .option-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 8px;
      color: var(--text-dim);
      font-size: 12px;
      font-family: 'Barlow', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
      -webkit-tap-highlight-color: transparent;
    }
    .option-btn.selected {
      background: var(--gold-glow);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
    }
    .form-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Barlow', sans-serif;
      resize: none;
      line-height: 1.5;
    }
    .form-textarea:focus {
      outline: none;
      border-color: var(--gold-dim);
    }
    .form-textarea::placeholder { color: var(--muted); }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: #080808;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px #C9A84C30;
      -webkit-tap-highlight-color: transparent;
    }
    .submit-btn:disabled {
      background: var(--surface3);
      box-shadow: none;
      color: var(--faint);
      cursor: not-allowed;
    }

    .success-screen {
      text-align: center;
      padding: 40px 20px;
    }
    .success-screen .big-emoji { font-size: 56px; margin-bottom: 12px; }
    .success-screen .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--green);
    }
    .success-screen .sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── LOADING ─────────────────────────────────── */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      gap: 14px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── iOS SAFE AREAS ──────────────────────────── */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {

let state = {

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
  if (diff < 1) return 'Ahora mismo';
  if (diff < 60) return `Hace ${diff} min`;
  if (diff < 1440) return `Hace ${Math.floor(diff/60)}h ${diff%60}min`;
  return `Hace ${Math.floor(diff/1440)} días`;
}

function getAvgWait(reports) {
  const recent = reports.slice(0, 5).filter(r => {
    const mins = (Date.now() - new Date(r.timestamp)) / 60000;
    return mins < 90;
  });
  if (!recent.length) return null;
  const idx = recent.map(r => TIME_OPTIONS.indexOf(r.estimatedTime)).filter(i => i >= 0);
  if (!idx.length) return null;
  const avg = Math.round(idx.reduce((a,b) => a+b, 0) / idx.length);
  return TIME_OPTIONS[Math.min(avg, TIME_OPTIONS.length - 1)];
}

function setBridgeVars(bridge) {
  const root = document.documentElement;
  root.style.setProperty('--accent', bridge.color);
  root.style.setProperty('--accent-glow', bridge.accentGlow);
  root.style.setProperty('--accent-transparent', bridge.accentTransparent);
  root.style.setProperty('--tab-color', bridge.color);
}

// Horus Eye SVG for header (small)

// ══════════════════════════════════════════
// API
// ══════════════════════════════════════════
async function fetchReports() {
  try {
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getReports`);
    const data = await res.json();
    state.reports = data.reports || [];
    state.lastUpdated = new Date();
  } catch (e) {
    console.warn('Error fetching reports:', e);
  }
  state.loading = false;
  render();
}

async function submitReport(report) {
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'addReport', ...report }),
  });
  const data = await res.json();
  return data.success;
}

              <div class="ad-text">
                <div class="ad-headline-white">Anúnciate aquí</div>
                <div class="ad-sub-white">info@horussystem.net · 956-556-9674</div>
              </div>
            </div>
            <div class="ad-slide" id="adSlide1">
              <div class="ad-icon">🤖</div>
              <div class="ad-text">

function renderForm(bridge) {
  const f = state.formData;
  const canSubmit = f.position && f.lane && f.estimatedTime && !state.submitting;

  if (state.submitDone) {
    return `
      <div class="modal-overlay">

      </div>
    `;
  }

  return `
    <div class="modal-overlay" onclick="closeFormIfOutside(event)">
      <div class="modal-sheet" style="max-width:480px" onclick="event.stopPropagation()">

          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Carril</label>
          <div class="option-grid">
            ${bridge.lanes.map(l => `
              <button class="option-btn ${f.lane === l ? 'selected' : ''}" onclick="setField('lane','${encodeURIComponent(l)}')">${l}</button>
            `).join('')}

        </div>

        <div class="form-group">
          <label class="form-label">Tiempo estimado de cruce</label>
          <div class="option-grid">
            ${TIME_OPTIONS.map(t => `
              <button class="option-btn ${f.estimatedTime === t ? 'selected' : ''}" onclick="setField('estimatedTime','${encodeURIComponent(t)}')">${t}</button>
            `).join('')}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Comentario (opcional)</label>

            class="form-textarea"

          Cancelar

}

// ══════════════════════════════════════════

  state.activeBridge = i;
  state.showForm = false;
  render();
};

window.openForm = () => {
  state.showForm = true;
  state.submitDone = false;
  state.formData = { position: '', lane: '', estimatedTime: '', note: '' };
  render();
};

window.closeForm = () => {
  state.showForm = false;
  render();
};

window.closeFormIfOutside = (e) => {
  if (e.target.classList.contains('modal-overlay')) closeForm();
};

window.setField = (key, val) => {
  state.formData[key] = decodeURIComponent(val);
  render();
};

window.setNote = (val) => {
  state.formData.note = val;
};

window.handleSubmit = async () => {
  if (!state.formData.position || !state.formData.lane || !state.formData.estimatedTime) return;
  state.submitting = true;
  render();

  const bridge = BRIDGES[state.activeBridge];
  const report = {
    bridge: bridge.id,
    bridgeName: bridge.name,
    position: state.formData.position,
    lane: state.formData.lane,
    estimatedTime: state.formData.estimatedTime,
    note: state.formData.note,
    timestamp: new Date().toISOString(),
  };

  try {
    state.reports.unshift(report);
    state.submitDone = true;
    state.submitting = false;
    render();

    await submitReport(report);

    setTimeout(() => {
      fetchReports();
      closeForm();
    }, 1800);
  } catch (e) {
    console.error('Submit error:', e);
    state.submitting = false;
    state.submitDone = true;
    render();
    setTimeout(closeForm, 2000);
  }
};

window.installApp = async () => {
  if (state.installPrompt) {
    state.installPrompt.prompt();
    const { outcome } = await state.installPrompt.userChoice;
    if (outcome === 'accepted') state.showInstallBanner = false;
    state.installPrompt = null;
    render();
  }
};

window.dismissInstall = () => {
  state.showInstallBanner = false;
  localStorage.setItem('install-dismissed', '1');
  render();
};

// ══════════════════════════════════════════
// PWA
// ══════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/cruce-reynosa/sw.js').catch(console.error);
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  state.installPrompt = e;
  if (!localStorage.getItem('install-dismissed')) {
    state.showInstallBanner = true;
    render();
  }
});

// ══════════════════════════════════════════
// AD BANNER ROTATION
// ══════════════════════════════════════════
let adIndex = 0;
const AD_COUNT = 2;

// Runs on a global interval; queries DOM fresh each tick so it survives render()
setInterval(() => {
  const prev = adIndex;
  adIndex = (adIndex + 1) % AD_COUNT;

  const prevSlide = document.getElementById('adSlide' + prev);
  const nextSlide = document.getElementById('adSlide' + adIndex);
  const prevDot   = document.getElementById('adDot' + prev);
  const nextDot   = document.getElementById('adDot' + adIndex);
  const banner    = document.getElementById('adBanner');

  if (!prevSlide || !nextSlide) return;

  prevSlide.classList.remove('active');
  nextSlide.classList.add('active');
  if (prevDot)  prevDot.classList.remove('active');
  if (nextDot)  nextDot.classList.add('active');
  if (banner)   banner.classList.toggle('slide-white', adIndex === 0);
}, 6000);

// After each render, sync the banner to current adIndex
function syncAdBanner() {
  for (let i = 0; i < AD_COUNT; i++) {
    const slide = document.getElementById('adSlide' + i);
    const dot   = document.getElementById('adDot' + i);
    if (!slide) continue;
    slide.classList.toggle('active', i === adIndex);
    if (dot) dot.classList.toggle('active', i === adIndex);
  }
  const banner = document.getElementById('adBanner');
  if (banner) banner.classList.toggle('slide-white', adIndex === 0);
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
setBridgeVars(BRIDGES[0]);
render();
fetchReports();
setInterval(fetchReports, CONFIG.REFRESH_INTERVAL);
</script>
