<!-- GTM NO SCRIPT -->
<noscript>
  <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P2RPXZMN"
  height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>

<div id="app"></div>

<script>

/* =========================
   CONFIG
========================= */
const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzAjkhZ813kubhqFNBUX8LjNrR_tD_vwRUXrbfufifbhWQvAu10YHZmwugP2MC8PsPC/exec',
  REFRESH_INTERVAL: 5 * 60 * 1000,
};

/* =========================
   PUENTES (CORREGIDO)
========================= */
const BRIDGES = [
{
  id: 'anzalduas',
  name: 'Anzalduas',
  type: 'Internacional',
  lanes: ['General','FAST'],
  points: {
    P0:{lat:26.0966,lng:-98.3604},
    P1:{lat:26.1077,lng:-98.3527},
    P2:{lat:26.1140,lng:-98.3210}
  }
},
{
  id: 'hidalgo',
  name: 'Hidalgo',
  type: 'Internacional',
  lanes: ['General','Ready Lane'],
  points: {
    P0:{lat:26.0681,lng:-98.2594},
    P1:{lat:26.0735,lng:-98.2593},
    P2:{lat:26.0832,lng:-98.2659}
  }
}
];

/* =========================
   ESTADO
========================= */
const state = {
  activeBridge: 0,
  map: null
};

/* =========================
   MAPA
========================= */
function initMap() {
  const bridge = BRIDGES[state.activeBridge];

  state.map = L.map('app').setView(
    [bridge.points.P0.lat, bridge.points.P0.lng],
    13
  );

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
    .addTo(state.map);

  Object.values(bridge.points).forEach(p => {
    L.marker([p.lat, p.lng]).addTo(state.map);
  });
}

/* =========================
   INIT
========================= */
window.onload = () => {
  initMap();
};

</script>
