<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cruce Reynosa 🌉</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ... (MANTÉN TODO TU BLOQUE DE CSS EXACTAMENTE IGUAL AQUÍ) ... */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #080808; --surface: #0f0f0f; --surface2: #161616; --surface3: #1e1e1e; --border: #242424; --border-gold: #C9A84C40; --text: #f0ede8; --text-dim: #b0a99a; --muted: #6b6459; --faint: #3a3530; --gold: #C9A84C; --gold-bright: #E2C46D; --gold-dim: #8a7035; --gold-glow: #C9A84C20; --gold-glow-strong: #C9A84C40; --green: #4ade80; --yellow: #fbbf24; --red: #f87171; --blue: #60a5fa; --accent: var(--gold); --accent-glow: var(--gold-glow); --accent-transparent: var(--gold-glow-strong); }
    html, body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; height: 100%; overflow-x: hidden; overflow-y: auto; }
    #splash { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.6s; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-brand { font-family: 'Cormorant Garamond', serif; font-size: 42px; color: var(--gold); }
    #app { min-height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; }
    .header { background: var(--surface); padding: 14px 18px 0; border-bottom: 1px solid var(--border); }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
    .tab { padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; font-family: 'Barlow Condensed'; font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; white-space: nowrap; }
    .tab.active { background: var(--accent-transparent); color: var(--accent); border-color: var(--accent); }
    .traffic-card { background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%); border: 1px solid var(--border-gold); border-radius: 16px; padding: 20px; margin: 16px 18px; }
    .traffic-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .traffic-time { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 600; }
    .traffic-status { padding: 6px 12px; border-radius: 20px; background: var(--surface3); font-family: 'Barlow Condensed'; font-size: 11px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .status-fluido { color: var(--green); } .status-fluido .status-dot { background: var(--green); }
    .status-moderado { color: var(--yellow); } .status-moderado .status-dot { background: var(--yellow); }
    .status-pesado { color: var(--red); } .status-pesado .status-dot { background: var(--red); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .report-btn { background: linear-gradient(135deg, var(--accent) 0%, var(--gold-dim) 100%); border: 1px solid var(--gold-bright); border-radius: 12px; padding: 16px; margin: 0 18px 16px; font-family: 'Barlow Condensed'; font-size: 15px; font-weight: 800; color: var(--bg); text-transform: uppercase; width: calc(100% - 36px); }
    .reports-section { padding: 0 18px 100px; }
    .report-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .report-header { display: flex; justify-content: space-between; }
    .report-position { font-weight: 600; }
    .report-time-badge { color: var(--gold); font-family: 'Barlow Condensed'; font-size: 11px; font-weight: 700; }
    .report-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-dim); margin-top: 8px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; }
    .modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; padding: 24px; max-width: 480px; }
    .option-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .option-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); }
    .option-btn.selected { background: var(--accent-transparent); border-color: var(--accent); color: var(--accent); }
    .submit-btn { width: 100%; background: var(--gold); color: var(--bg); padding: 16px; font-weight: 800; font-family: 'Barlow Condensed'; border-radius: 12px; text-transform: uppercase; border: none; margin-top: 10px; }
  </style>
</head>
<body>

<div id="splash"><div class="splash-brand">HORUS</div></div>

<div id="app"></div>

<script>
// 🔴 PON LA URL DE TU NUEVA IMPLEMENTACIÓN DE APPS SCRIPT AQUÍ 🔴
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVRCfmU9E3kKKSOIwokc8q4gglO9TEDlvifxOh8CWp3Q3WYFr8znbHe4wseC6re8g/exec';

const BRIDGES = [
  { id: 'anzalduas', name: 'Anzalduas', type: 'Internacional', lanes: ['General', 'SENTRI', 'FAST'] },
  { id: 'hidalgo', name: 'Hidalgo', type: 'Internacional', lanes: ['General', 'SENTRI', 'Ready'] },
  { id: 'sentri_hidalgo', name: 'Hidalgo SENTRI', type: 'SENTRI/FAST', lanes: ['SENTRI'] },
  { id: 'peatonal_hidalgo', name: 'Hidalgo Peatonal', type: 'Peatonal', lanes: ['General'] },
  { id: 'pharr', name: 'Pharr', type: 'Internacional', lanes: ['General', 'Comercial'] }
];

const state = {
  activeBridge: 0,
  reports: [],
  serverTraffic: {}, // La data que manda el servidor (Google + Reglas Fijas)
  showForm: false,
  formData: { position: '', lane: '', estimatedTime: '' }
};

// ── OBTENER DATOS DEL SERVIDOR ──
async function fetchReports() {
  try {
    // El timestamp &t=... evita que el navegador use caché
    const res = await fetch(APPS_SCRIPT_URL + '?action=getReports&t=' + new Date().getTime());
    const data = await res.json();
    state.reports = data.reports || [];
    state.serverTraffic = data.serverTraffic || {};
    render();
  } catch (e) {
    console.error("Error cargando datos", e);
  }
}

// ── LÓGICA DE FUSIÓN DE TIEMPO ──
function calculateFinalTime(bridgeId) {
  // 1. Obtener lo que dice el servidor (Google Maps o Regla Fija)
  const serverData = state.serverTraffic[bridgeId];
  let finalTime = serverData ? serverData.estimatedTime : 0;
  let finalSource = serverData ? serverData.source : 'Sin datos';
  let finalStatus = serverData ? serverData.status : 'fluido';

  // 2. Extraer promedio de reportes de usuarios reales (últimos 30 mins)
  const bridgeReports = state.reports.filter(r => r.bridge === bridgeId);
  const recentReports = bridgeReports.filter(r => (new Date() - new Date(r.timestamp)) / 60000 < 30);
  
  if (recentReports.length > 0) {
    let sum = 0;
    recentReports.forEach(r => {
      const match = r.estimatedTime.match(/\d+/);
      let mins = match ? parseInt(match[0]) : 0;
      if (r.estimatedTime.includes('hora')) mins *= 60;
      sum += mins;
    });
    
    const userAvg = sum / recentReports.length;
    
    // Si la fuente es horario fijo (Sentri/Peatonal), NO ignoramos al usuario.
    // Promediamos 50% servidor / 50% usuarios reales.
    finalTime = Math.round((finalTime * 0.4) + (userAvg * 0.6));
    finalSource = 'Google + Usuarios';
    
    // Ajustar estado por color
    finalStatus = finalTime < 15 ? 'fluido' : (finalTime < 45 ? 'moderado' : 'pesado');
  }

  return { time: finalTime || 5, source: finalSource, status: finalStatus, reports: bridgeReports };
}

// ── RENDER ──
function render() {
  const bridge = BRIDGES[state.activeBridge];
  const calc = calculateFinalTime(bridge.id);
  
  // Colores por puente
  const colors = ['#C9A84C', '#60a5fa', '#4ade80', '#fbbf24', '#f87171'];
  document.documentElement.style.setProperty('--accent', colors[state.activeBridge]);

  let html = `
    <div class="header">
      <div style="color:var(--gold); font-size:24px; font-weight:bold; margin-bottom:10px;">HORUS System Co.</div>
      <div class="tabs">
        ${BRIDGES.map((b, i) => `<div class="tab ${state.activeBridge === i ? 'active' : ''}" onclick="state.activeBridge=${i}; render()">${b.name}</div>`).join('')}
      </div>
    </div>

    <div class="traffic-card">
      <div class="traffic-header">
        <div>
          <div style="color:var(--muted); font-size:12px; text-transform:uppercase;">Tiempo Estimado</div>
          <div class="traffic-time">${calc.time} min</div>
        </div>
        <div class="traffic-status status-${calc.status}">
          <div class="status-dot"></div>${calc.status}
        </div>
      </div>
      <div style="font-size:11px; color:var(--faint); text-transform:uppercase; margin-top:10px;">
        Fuente: ${calc.source}
      </div>
    </div>

    <button class="report-btn" onclick="state.showForm=true; render()">📍 Reportar Fila</button>

    <div class="reports-section">
      <div style="color:var(--muted); font-size:12px; margin-bottom:10px;">REPORTES DE USUARIOS</div>
      ${calc.reports.slice(0, 10).map(r => `
        <div class="report-card">
          <div class="report-header">
            <div class="report-position">${r.position}</div>
            <div class="report-time-badge">${r.estimatedTime}</div>
          </div>
          <div class="report-meta"><span>🚗 ${r.lane}</span></div>
          ${r.note ? `<div style="margin-top:8px; font-size:12px; color:var(--muted);">${r.note}</div>` : ''}
        </div>
      `).join('') || '<div style="color:var(--muted); text-align:center; padding:20px;">No hay reportes recientes</div>'}
    </div>
  `;

  if (state.showForm) {
    html += `
      <div class="modal-overlay" onclick="state.showForm=false; render()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
          <h2 style="color:var(--text); margin-bottom:20px;">Reportar en ${bridge.name}</h2>
          
          <div style="color:var(--text-dim); margin-bottom:10px;">Tiempo de cruce:</div>
          <div class="option-grid">
            ${['5-10 min', '20-30 min', '40-50 min', '1 hora', '1.5 horas', '2+ horas'].map(t => 
              `<button class="option-btn ${state.formData.estimatedTime === t ? 'selected' : ''}" onclick="state.formData.estimatedTime='${t}'; render()">${t}</button>`
            ).join('')}
          </div>

          <button class="submit-btn" onclick="submitReport()">Publicar Reporte</button>
        </div>
      </div>
    `;
  }

  document.getElementById('app').innerHTML = html;
}

// ── ENVIAR REPORTE ──
async function submitReport() {
  if (!state.formData.estimatedTime) return alert("Selecciona un tiempo");
  
  const payload = {
    action: 'addReport',
    bridge: BRIDGES[state.activeBridge].id,
    bridgeName: BRIDGES[state.activeBridge].name,
    position: 'Reporte Rápido',
    lane: BRIDGES[state.activeBridge].lanes[0],
    estimatedTime: state.formData.estimatedTime,
    note: ''
  };

  state.showForm = false;
  render();

  await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
  fetchReports(); // Recargar datos frescos
}

// Inicializar
setTimeout(() => document.getElementById('splash').remove(), 1000);
render();
fetchReports();
setInterval(fetchReports, 5 * 60 * 1000); // Actualizar cada 5 min
</script>
</body>
</html>
