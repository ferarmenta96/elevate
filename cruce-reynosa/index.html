  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #0f0f0f;
      --surface2: #161616;
      --surface3: #1e1e1e;
      --border: #242424;
      --border-gold: #C9A84C40;
      --text: #f0ede8;
      --text-dim: #b0a99a;
      --muted: #6b6459;
      --faint: #3a3530;
      --gold: #C9A84C;
      --gold-bright: #E2C46D;
      --gold-dim: #8a7035;
      --gold-glow: #C9A84C20;
      --gold-glow-strong: #C9A84C40;
      --green: #4ade80;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      --accent: var(--gold);
      --accent-glow: var(--gold-glow);
      --accent-transparent: var(--gold-glow-strong);
      --tab-color: var(--gold);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── SPLASH SCREEN ──────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #splash.hidden {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-eye {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: splashPulse 2s ease-in-out infinite;
    }

    @keyframes splashPulse {
      0%, 100% { filter: drop-shadow(0 0 8px #C9A84C60); }
      50% { filter: drop-shadow(0 0 24px #C9A84C90); }
    }

    .splash-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 8px;
      color: var(--gold);
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 4px;
    }
    .splash-tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .splash-divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin-bottom: 24px;
    }
    .splash-app-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text);
      text-transform: uppercase;
    }
    .splash-app-sub {
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .splash-loading {
      position: absolute;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .splash-bar {
      width: 120px;
      height: 1px;
      background: var(--faint);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }
    .splash-bar-fill {
      height: 100%;
      background: var(--gold);
      animation: splashLoad 1.6s ease forwards;
      width: 0;
    }
    @keyframes splashLoad {
      0% { width: 0 }
      60% { width: 80% }
      100% { width: 100% }
    }
    .splash-loading-text {
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── APP ────────────────────────────────────── */
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px 0;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-eye {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .logo-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--gold);
      text-transform: uppercase;
    }

    .logo-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #4ade8015;
      border: 1px solid #4ade8030;
      border-radius: 20px;
      padding: 5px 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      color: var(--green);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 5px; height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── TABS ───────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 12px;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--accent-transparent);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .tab:hover:not(.active) {
      background: var(--surface3);
      border-color: var(--border-gold);
    }

    /* ── TRAFFIC CARD ───────────────────────────── */
    .traffic-card {
      background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 20px;
      margin: 16px 18px;
      position: relative;
      overflow: hidden;
    }

    .traffic-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .traffic-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .traffic-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .traffic-time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 600;
      line-height: 1;
      color: var(--text);
    }

    .traffic-status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status-fluido { color: var(--green); }
    .status-fluido .status-dot { background: var(--green); }
    .status-moderado { color: var(--yellow); }
    .status-moderado .status-dot { background: var(--yellow); }
    .status-pesado { color: var(--red); }
    .status-pesado .status-dot { background: var(--red); }

    .traffic-meta {
      display: flex;
      gap: 16px;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 12px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── MAP CONTAINER ──────────────────────────── */
    .map-container {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 0 18px 16px;
      overflow: hidden;
      height: 280px;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .queue-indicator {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* ── REPORT BUTTON ──────────────────────────── */
    .report-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--gold-dim) 100%);
      border: 1px solid var(--gold-bright);
      border-radius: 12px;
      padding: 16px;
      margin: 0 18px 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--bg);
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px var(--gold-glow);
    }

    .report-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px var(--gold-glow-strong);
    }

    .report-btn:active {
      transform: translateY(0);
    }

    /* ── REPORTS LIST ───────────────────────────── */
    .reports-section {
      flex: 1;
      overflow-y: visible;
      padding: 0 18px 100px;
    }

    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border));
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to left, transparent, var(--border));
    }

    .report-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .report-card:hover {
      background: var(--surface3);
      border-color: var(--border-gold);
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .report-position {
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .report-time-badge {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold);
      white-space: nowrap;
    }

    .report-meta {
      display: flex;
      gap: 12px;
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .report-note {
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
      padding: 8px;
      background: var(--surface);
      border-left: 2px solid var(--border-gold);
      border-radius: 4px;
    }

    .report-timestamp {
      font-family: 'Barlow', sans-serif;
      font-size: 11px;
      color: var(--faint);
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-emoji {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ── AD BANNER ───────────────────────────────── */
    .ad-banner {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 0 18px 16px;
      overflow: hidden;
      height: 140px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s;
    }

    .ad-banner:hover {
      border-color: var(--border-gold);
      transform: translateY(-2px);
    }

    .ad-banner.slide-white {
      background: #f8f8f8;
    }

    .ad-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .ad-slide.active {
      opacity: 1;
    }

    .ad-content {
      text-align: center;
      width: 100%;
    }

    .ad-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 5px;
      color: var(--gold);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .ad-tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      line-height: 1.4;
    }

    .slide-white .ad-tagline {
      color: #666;
    }

    .ad-indicators {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }

    .ad-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      transition: all 0.3s;
    }

    .ad-dot.active {
      background: var(--gold);
      width: 20px;
      border-radius: 3px;
    }

    .slide-white .ad-dot {
      background: #ccc;
    }

    .slide-white .ad-dot.active {
      background: var(--gold);
    }

    /* ── BOTTOM NAV ──────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-family: 'Barlow', sans-serif;
      font-size: 11px;
      color: var(--muted);
      z-index: 100;
    }

    .powered-by {
      position: fixed;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 8px;
      background: transparent;
      z-index: 99;
    }

    .powered-text {
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      color: var(--faint);
      letter-spacing: 1px;
    }

    .powered-logo {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .powered-horus {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--gold-dim);
    }

    /* ── INSTALL BANNER ──────────────────────────── */
    .install-banner {
      position: fixed;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 440px;
      width: calc(100% - 36px);
      background: var(--surface2);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 101;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .install-banner-text {
      flex: 1;
    }

    .install-banner-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
    }

    .install-banner-sub {
      font-family: 'Barlow', sans-serif;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .install-btn {
      background: var(--gold);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--bg);
      cursor: pointer;
      text-transform: uppercase;
    }

    .install-close {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
    }

    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-sheet {
      background: var(--surface);
      border: 1px solid var(--border-gold);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      animation: slideUp 0.3s ease;
      position: relative;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .modal-sub {
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;

async function fetchTrafficData(bridge) {
  try {
    // 🔥 VERIFICAR SI GOOGLE MAPS ESTÁ DISPONIBLE
    if (typeof google === 'undefined' || !google.maps) {
      console.warn('⚠️ Google Maps no está cargado. Verifica tu API Key.');
      return null;
    }

    const points = bridge.points;
    const pointKeys = Object.keys(points); // ['P0','P1',...,'P9']
    
    // Construir segmentos dinámicamente desde todos los puntos disponibles
    const segments = [];
    for (let i = 0; i < pointKeys.length - 1; i++) {
      const fromKey = pointKeys[i];
      const toKey = pointKeys[i + 1];
      segments.push({
        from: points[fromKey],
        to: points[toKey],
        name: `${fromKey}-${toKey}`
      });
    }

    const trafficTimes = [];
    const normalTimes = [];

    console.log(`🗺️ Obteniendo tráfico para ${bridge.name} (${segments.length} segmentos)...`);

    for (const segment of segments) {
      try {
        // Calcular tiempo CON tráfico
        const trafficTime = await getDirectionsTime(segment.from, segment.to, true);
        // Calcular tiempo SIN tráfico
        const normalTime = await getDirectionsTime(segment.from, segment.to, false);
        
        // ── APLICAR FACTOR DE CORRECCIÓN POR ZONA ──
        // Google suaviza tráfico detenido; los segmentos cerca del puente
        // necesitan multiplicadores más altos para reflejar la realidad.
        const zoneFactor = CONFIG.ALGORITHM.ZONE_CORRECTION_FACTORS[segment.name] || 1.5;
        const delta = trafficTime - normalTime;
        
        let correctedTrafficTime = trafficTime;
        
        // Si el ΔT supera el umbral, aplicar multiplicador de anomalía
        if (delta > CONFIG.ALGORITHM.ANOMALY_THRESHOLD_MINUTES) {
          correctedTrafficTime = normalTime + (delta * CONFIG.ALGORITHM.ANOMALY_MULTIPLIER);
          console.log(`⚠️ ${segment.name}: Anomalía detectada. ΔT=${delta.toFixed(1)}min → x${CONFIG.ALGORITHM.ANOMALY_MULTIPLIER}`);
        }
        
        // Siempre aplicar el factor de zona sobre el tiempo corregido
        correctedTrafficTime = correctedTrafficTime * zoneFactor;
        
        // Usar el máximo entre tiempo corregido y tiempo real (evitar subestimación)
        const finalTrafficTime = Math.max(correctedTrafficTime, trafficTime);
        
        trafficTimes.push({ segment: segment.name, time: finalTrafficTime, raw: trafficTime });
        normalTimes.push({ segment: segment.name, time: normalTime });
        
        console.log(`✅ ${segment.name}: ${trafficTime.toFixed(1)}min raw → ${finalTrafficTime.toFixed(1)}min corregido (factor ${zoneFactor}x)`);
      } catch (segmentError) {
        console.error(`❌ Error en segmento ${segment.name}:`, segmentError.message);
        // Continuar con el siguiente segmento
      }
    }

    if (trafficTimes.length === 0) {
      console.warn('⚠️ No se pudo obtener ningún dato de tráfico');
      return null;
    }

    console.log(`✅ Datos de tráfico obtenidos exitosamente para ${bridge.name}`);
    return { trafficTimes, normalTimes, bridge: bridge.id };
  } catch (error) {
    console.error('❌ Error general al obtener tráfico:', error);
    return null;
  }
}

async function getDirectionsTime(origin, destination, withTraffic) {
  return new Promise((resolve, reject) => {
    // 🔥 VERIFICAR QUE GOOGLE MAPS ESTÉ DISPONIBLE
    if (typeof google === 'undefined' || !google.maps) {
      reject(new Error('Google Maps no está disponible'));
      return;
    }

    const directionsService = new google.maps.DirectionsService();
    
    const request = {
      origin: new google.maps.LatLng(origin.lat, origin.lng),
      destination: new google.maps.LatLng(destination.lat, destination.lng),
      travelMode: google.maps.TravelMode.DRIVING,
      drivingOptions: withTraffic ? {
        departureTime: new Date(),
        trafficModel: google.maps.TrafficModel.BEST_GUESS
      } : undefined
    };

    directionsService.route(request, (result, status) => {
      if (status === google.maps.DirectionsStatus.OK) {
        const duration = result.routes[0].legs[0].duration.value; // segundos
        resolve(duration / 60); // convertir a minutos
      } else {
        // 🔥 MENSAJES DE ERROR MÁS CLAROS
        let errorMsg = `Directions API error: ${status}`;
        
        if (status === 'ZERO_RESULTS') {
          errorMsg = 'No se encontró ruta entre los puntos. Verifica las coordenadas.';
        } else if (status === 'REQUEST_DENIED') {
          errorMsg = 'API Key inválida o sin permisos. Verifica tu configuración.';
        } else if (status === 'OVER_QUERY_LIMIT') {
          errorMsg = 'Límite de consultas excedido. Espera unos minutos.';
        } else if (status === 'INVALID_REQUEST') {
          errorMsg = 'Solicitud inválida. Verifica las coordenadas.';
        }
        
        reject(new Error(errorMsg));
      }
    });
  });
}

// FACTOR DINÁMICO — Se recalibra con reportes ciudadanos
// ══════════════════════════════════════════
// dynamicFactor[bridgeId] = { factor, updatedAt }
const dynamicFactors = {};

function updateDynamicFactor(bridgeId, googleEstimate, userEstimate) {
  if (!CONFIG.ALGORITHM.DYNAMIC_FACTOR_ENABLED) return;
  if (!userEstimate || !googleEstimate || googleEstimate === 0) return;
  
  const newFactor = userEstimate / googleEstimate;
  // Limitar factor entre 0.5x y 10x para evitar valores extremos
  const clampedFactor = Math.min(10, Math.max(0.5, newFactor));
  
  dynamicFactors[bridgeId] = {
    factor: clampedFactor,
    updatedAt: Date.now(),
    googleEstimate: googleEstimate.toFixed(1),
    userEstimate: userEstimate.toFixed(1)
  };
  
  console.log(`🔄 Factor dinámico actualizado para ${bridgeId}: ${clampedFactor.toFixed(2)}x (Google: ${googleEstimate.toFixed(1)}min → Usuarios: ${userEstimate.toFixed(1)}min)`);
}

function getDynamicFactor(bridgeId) {
  const stored = dynamicFactors[bridgeId];
  if (!stored) return 1.0;
  
  // El factor expira después de 30 minutos
  const age = (Date.now() - stored.updatedAt) / 1000 / 60;
  if (age > 30) {
    delete dynamicFactors[bridgeId];
    return 1.0;
  }
  
  return stored.factor;
}

    };
  }

  const { trafficTimes, normalTimes } = trafficData;
  
  // Calcular diferencias de tiempo (ΔT) — ya con factores de zona aplicados
  const deltas = trafficTimes.map((t, i) => ({
    segment: t.segment,
    delta: t.time - normalTimes[i].time,
    trafficTime: t.time,
    normalTime: normalTimes[i].time,
    raw: t.raw || t.time
  }));

  console.log('📈 Deltas calculados:', deltas.map(d => `${d.segment}: +${d.delta.toFixed(1)}min`).join(', '));

  // Sumar tiempos de TODOS los segmentos (método correcto vs ruta completa)
  const totalGoogleTime = deltas.reduce((sum, d) => sum + d.trafficTime, 0);
  
  // Encontrar primer segmento con ΔT significativo (inicio de fila)
  const queueStartSegment = deltas.find(d => d.delta > CONFIG.ALGORITHM.ANOMALY_THRESHOLD_MINUTES);
  
  // 🔥 DETECTAR PRESENCIA EN FILA: múltiples segmentos consecutivos con ΔT alto
  const consecutiveHighDeltas = deltas.filter((d, i, arr) => {
    if (d.delta <= CONFIG.ALGORITHM.ANOMALY_THRESHOLD_MINUTES) return false;
    // Verificar si el segmento anterior también tiene ΔT alto
    const prev = arr[i - 1];
    return !prev || prev.delta > CONFIG.ALGORITHM.ANOMALY_THRESHOLD_MINUTES;
  });
  
  const isInQueue = consecutiveHighDeltas.length >= 2;
  if (isInQueue) {
    console.log(`🚨 Usuario posiblemente DENTRO de la fila (${consecutiveHighDeltas.length} segmentos consecutivos con alta demora)`);
  }

  // 🔥 SI NO HAY CONGESTION EN GOOGLE PERO SÍ HAY REPORTES DE USUARIOS
  if (!queueStartSegment && userReports && userReports.length > 0) {
    const userEstimate = calculateUserEstimate(userReports);
    
    console.log('⚙️ Google dice fluido, pero hay reportes de usuarios');
    console.log('⏱️ Tiempo estimado (usuarios):', userEstimate ? `${userEstimate.toFixed(1)} min` : 'N/A');
    
    if (userEstimate) {
      // Recalibrar factor dinámico
      if (bridgeId) updateDynamicFactor(bridgeId, totalGoogleTime, userEstimate);
      
      return {
        status: getTrafficStatus(userEstimate),
        queueLength: 0,
        estimatedTime: Math.round(userEstimate),
        queueStartSegment: null,
        deltas,
        source: 'usuarios',
        isInQueue
      };
    }
  }
  
  if (!queueStartSegment) {
    console.log('✅ No se detectó congestionamiento (fluido)');
    return { 
      status: 'fluido', 
      queueLength: 0, 
      estimatedTime: Math.max(5, Math.round(totalGoogleTime)),
      source: 'google' 
    };
  }

  console.log('🚦 Inicio de fila detectado en:', queueStartSegment.segment);

  // Calcular longitud de fila
  const queueLength = CONFIG.ALGORITHM.SEGMENT_DISTANCES_KM[queueStartSegment.segment] || 0;
  
  // Tiempo Google ya incluye factores de corrección por zona (aplicados en fetchTrafficData)
  let estimatedTime = totalGoogleTime;
  
  // Aplicar factor dinámico si está disponible
  const dynFactor = bridgeId ? getDynamicFactor(bridgeId) : 1.0;
  if (dynFactor !== 1.0) {
    console.log(`⚡ Aplicando factor dinámico: ${dynFactor.toFixed(2)}x`);
    estimatedTime = estimatedTime * dynFactor;
  }

  console.log('📏 Longitud de fila:', queueLength, 'km');
  console.log('⏱️ Tiempo estimado (Google corregido):', estimatedTime.toFixed(1), 'min');

  // Fusionar con datos de usuarios
  const userEstimate = calculateUserEstimate(userReports);
  const finalEstimate = fuseEstimates(estimatedTime, userEstimate);
  
  // Recalibrar factor dinámico con los nuevos datos
  if (bridgeId && userEstimate) updateDynamicFactor(bridgeId, estimatedTime, userEstimate);

  console.log('⏱️ Tiempo estimado (usuarios):', userEstimate ? `${userEstimate.toFixed(1)} min` : 'N/A');
  console.log('⏱️ Tiempo FINAL (fusionado):', finalEstimate.toFixed(1), 'min');

  return {
    status: getTrafficStatus(finalEstimate),
    queueLength,
    estimatedTime: Math.round(finalEstimate),
    queueStartSegment: queueStartSegment.segment,
    deltas,
    isInQueue,
    source: userEstimate ? 'fusionado' : 'google'
  };
}

function calculateQueueLength(startSegment) {
  return CONFIG.ALGORITHM.SEGMENT_DISTANCES_KM[startSegment] || 0;
}

function calculateUserEstimate(reports) {
  if (!reports || reports.length === 0) return null;

  const recentReports = reports
    .filter(r => {
      const age = (new Date() - new Date(r.timestamp)) / 1000 / 60; // minutos
      return age < CONFIG.ALGORITHM.MAX_REPORT_AGE_MINUTES;
    })
    .slice(0, CONFIG.ALGORITHM.RECENT_REPORTS_COUNT);

  if (recentReports.length === 0) return null;

  // Convertir tiempos a minutos
  const times = recentReports.map(r => parseTimeToMinutes(r.estimatedTime));
  const avg = times.reduce((a, b) => a + b, 0) / times.length;
  
  return avg;
}

function parseTimeToMinutes(timeStr) {
  const matches = timeStr.match(/(\d+)/g);
  if (!matches) return 0;
  if (timeStr.includes('hora')) {
    return parseInt(matches[0]) * 60;
  }
  return parseInt(matches[0]);
}

function fuseEstimates(googleEstimate, userEstimate) {
  if (!userEstimate) return googleEstimate;
  
  return (googleEstimate * CONFIG.ALGORITHM.GOOGLE_WEIGHT) + 
         (userEstimate * CONFIG.ALGORITHM.USER_WEIGHT);
}

function getTrafficStatus(minutes) {
  if (minutes < 15) return 'fluido';
  if (minutes < 45) return 'moderado';
  return 'pesado';
}

function initMap(bridge) {
  const mapContainer = document.getElementById('map');
  if (!mapContainer) return;

  // Centro del mapa en P2 (donde probablemente empieza la fila)
  const center = bridge.points.P2;

  state.map = new google.maps.Map(mapContainer, {
    center: center,
    zoom: 14,
    styles: [
      { elementType: 'geometry', stylers: [{ color: '#1a1a1a' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#0a0a0a' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#746855' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2a2a2a' }] },
      { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#212121' }] },
      { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#3a3a3a' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0f0f0f' }] },
    ],
    disableDefaultUI: true,
    zoomControl: true,
  });

  // Dibujar puntos
  drawBridgePoints(bridge);
}

function drawBridgePoints(bridge) {
  // Limpiar marcadores previos
  state.mapMarkers.forEach(m => m.setMap(null));
  state.mapMarkers = [];

  if (state.queuePolyline) {
    state.queuePolyline.setMap(null);
  }

  const points = bridge.points;
  
  // Marcar todos los puntos
  Object.entries(points).forEach(([name, coords]) => {
    const marker = new google.maps.Marker({
      position: coords,
      map: state.map,
      title: name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 6,
        fillColor: name === 'P4' ? '#C9A84C' : '#666',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 1,
      }
    });
    state.mapMarkers.push(marker);
  });

  // Dibujar línea de la ruta
  const path = Object.values(points);
  const polyline = new google.maps.Polyline({
    path: path,
    geodesic: true,
    strokeColor: '#C9A84C',
    strokeOpacity: 0.6,
    strokeWeight: 3,
    map: state.map
  });
  
  state.queuePolyline = polyline;

  // Si hay datos de fila, resaltar el inicio
  const queueData = state.queueData[bridge.id];
  if (queueData && queueData.queueStartSegment) {
    highlightQueueStart(queueData.queueStartSegment, points);
  }
}

function highlightQueueStart(segment, points) {
  // Extraer puntos del segmento (ej: "P1-P2" → P1 y P2)
  const [start, end] = segment.split('-');
  const startPoint = points[start];
  const endPoint = points[end];

  // Marcar inicio de fila con color rojo
  const queueMarker = new google.maps.Marker({
    position: startPoint,
    map: state.map,
    title: 'Inicio de Fila',
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 10,
      fillColor: '#f87171',
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 2,
    },
    animation: google.maps.Animation.BOUNCE,
  });
  state.mapMarkers.push(queueMarker);
}

// API - FETCH REPORTS
// ══════════════════════════════════════════

async function fetchReports() {
  try {
    const response = await fetch(CONFIG.APPS_SCRIPT_URL + '?action=getReports&t=' + new Date().getTime());
    const data = await response.json();
    state.reports = data.reports || [];
    
    // 🔥 CALCULAR DATOS DE FILA PARA TODOS LOS PUENTES
    for (const bridge of BRIDGES) {
      const bridgeReports = state.reports.filter(r => r.bridge === bridge.id);
      
      // Intentar obtener datos de tráfico de Google
      let trafficData = null;
      try {
        trafficData = await fetchTrafficData(bridge);
        if (trafficData) {
          state.trafficData[bridge.id] = trafficData;
        }
      } catch (err) {
        console.log(`No se pudo obtener tráfico de Google para ${bridge.name}:`, err);
      }
      
      // Calcular datos de fila (con o sin datos de Google)
      const queueData = detectQueueStart(trafficData, bridgeReports, bridge.id);
      state.queueData[bridge.id] = queueData;
    }

    render();
    
    // Actualizar mapa si está inicializado
    const activeBridge = BRIDGES[state.activeBridge];
    if (state.map) {
      drawBridgePoints(activeBridge);
    }
  } catch (error) {
    console.error('Error fetching reports:', error);
    
    // 🔥 SI FALLA LA CONEXIÓN, CALCULAR CON DATOS LOCALES
    for (const bridge of BRIDGES) {
      const bridgeReports = state.reports.filter(r => r.bridge === bridge.id);
      const queueData = detectQueueStart(null, bridgeReports, bridge.id);
      state.queueData[bridge.id] = queueData;
    }
    
    render();
  }
}

async function submitReport(report) {
  try {
    await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'addReport', ...report })
    });
  } catch (error) {
    console.error('Error submitting report:', error);
    throw error;
  }
}

function timeAgo(isoString) {
  const now = new Date();
  const then = new Date(isoString);
  const diffMs = now - then;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHrs = Math.floor(diffMins / 60);

  if (diffMins < 1) return 'Ahora';
  if (diffMins < 60) return `${diffMins}m`;
  if (diffHrs < 24) return `${diffHrs}h`;
  return `${Math.floor(diffHrs / 24)}d`;
}

window.selectBridge = (i) => {
  state.activeBridge = i;
  state.showForm = false;
  
  // 🔥 RECALCULAR DATOS DEL PUENTE SELECCIONADO
  const bridge = BRIDGES[i];
  const bridgeReports = state.reports.filter(r => r.bridge === bridge.id);
  const trafficData = state.trafficData[bridge.id] || null;
  const queueData = detectQueueStart(trafficData, bridgeReports, bridge.id);
  state.queueData[bridge.id] = queueData;
  
  render();
};

window.openForm = () => {
  state.showForm = true;
  state.submitDone = false;
  state.formData = { position: '', lane: '', estimatedTime: '', note: '' };
  render();
};

window.closeForm = () => {
  state.showForm = false;
  render();
};

window.closeFormIfOutside = (e) => {
  if (e.target.classList.contains('modal-overlay')) closeForm();
};

window.setField = (key, val) => {
  state.formData[key] = decodeURIComponent(val);
  render();
};

window.setNote = (val) => {
  state.formData.note = val;
};

window.handleSubmit = async () => {
  if (!state.formData.position || !state.formData.lane || !state.formData.estimatedTime) return;
  state.submitting = true;
  render();

  const bridge = BRIDGES[state.activeBridge];
  const report = {
    bridge: bridge.id,
    bridgeName: bridge.name,
    position: state.formData.position,
    lane: state.formData.lane,
    estimatedTime: state.formData.estimatedTime,
    note: state.formData.note,
    timestamp: new Date().toISOString(),
  };

  try {
    // 🔥 PRIMERO: Enviar al servidor
    await submitReport(report);
    
    // 🔥 SEGUNDO: Mostrar éxito
    state.submitDone = true;
    state.submitting = false;
    render();

    // 🔥 TERCERO: Actualizar datos del servidor después de 1.5 segundos
    setTimeout(async () => {
      await fetchReports();
      closeForm();
    }, 1500);
  } catch (e) {
    console.error('Submit error:', e);
    state.submitting = false;
    state.submitDone = true;
    render();
    setTimeout(closeForm, 2000);
  }
};

window.installApp = async () => {
  if (state.installPrompt) {
    state.installPrompt.prompt();
    const { outcome } = await state.installPrompt.userChoice;
    if (outcome === 'accepted') state.showInstallBanner = false;
    state.installPrompt = null;
    render();
  }
};

window.dismissInstall = () => {
  state.showInstallBanner = false;
  localStorage.setItem('install-dismissed', '1');
  render();
};

// ══════════════════════════════════════════
// PWA
// ══════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/cruce-reynosa/sw.js').catch(console.error);
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  state.installPrompt = e;
  if (!localStorage.getItem('install-dismissed')) {
    state.showInstallBanner = true;
    render();
  }
});

// ══════════════════════════════════════════
// AD BANNER ROTATION
// ══════════════════════════════════════════
let adIndex = 0;
const AD_COUNT = 2;

setInterval(() => {
  const prev = adIndex;
  adIndex = (adIndex + 1) % AD_COUNT;

  const prevSlide = document.getElementById('adSlide' + prev);
  const nextSlide = document.getElementById('adSlide' + adIndex);
  const prevDot   = document.getElementById('adDot' + prev);
  const nextDot   = document.getElementById('adDot' + adIndex);
  const banner    = document.getElementById('adBanner');

  if (!prevSlide || !nextSlide) return;

  prevSlide.classList.remove('active');
  nextSlide.classList.add('active');
  if (prevDot)  prevDot.classList.remove('active');
  if (nextDot)  nextDot.classList.add('active');
  if (banner)   banner.classList.toggle('slide-white', adIndex === 0);
}, 6000);

function syncAdBanner() {
  for (let i = 0; i < AD_COUNT; i++) {
    const slide = document.getElementById('adSlide' + i);
    const dot   = document.getElementById('adDot' + i);
    if (!slide) continue;
    slide.classList.toggle('active', i === adIndex);
    if (dot) dot.classList.toggle('active', i === adIndex);
  }
  const banner = document.getElementById('adBanner');
  if (banner) banner.classList.toggle('slide-white', adIndex === 0);
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
setTimeout(() => {
  document.getElementById('splash').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('splash').remove();
  }, 600);
}, 2000);

setBridgeVars(BRIDGES[0]);
render();
fetchReports();
setInterval(fetchReports, CONFIG.REFRESH_INTERVAL);
</script>
</body>
</html>
