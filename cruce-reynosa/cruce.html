<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#1a0a2e"/>
  <title>Border Runner — Cruce Reynosa</title>
  <link rel="icon" type="image/png" href="/cruce-reynosa/public/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@700;800;900&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:#0d0820;touch-action:none}

    /* ── topbar ── */
    #topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 14px;
      background:rgba(13,8,32,0.95);
      border-bottom:1px solid #C9A84C25;
      height:46px;flex-shrink:0;
    }
    #back-btn{
      display:flex;align-items:center;gap:6px;
      background:none;border:1px solid #C9A84C40;border-radius:7px;
      padding:7px 12px;cursor:pointer;
      font-family:'Barlow Condensed',sans-serif;
      font-size:12px;font-weight:700;letter-spacing:1.5px;
      color:#C9A84C;text-transform:uppercase;text-decoration:none;
      transition:all 0.2s;
    }
    #back-btn:hover{background:#C9A84C15;border-color:#C9A84C70;}
    #topbar-brand{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;letter-spacing:3px;color:#C9A84C;}
    #topbar-score{font-family:'Press Start 2P',monospace;font-size:9px;color:#fff;min-width:60px;text-align:right;}

    /* ── layout ── */
    #root{
      display:flex;flex-direction:column;
      height:calc(100vh - 46px);
      background:#0d0820;
      user-select:none;-webkit-user-select:none;
    }

    /* ── HUD ── */
    #hud{
      display:flex;justify-content:space-between;align-items:center;
      padding:8px 16px 6px;flex-shrink:0;
    }
    .hud-block{display:flex;flex-direction:column;gap:2px;}
    .hud-block.center{align-items:center;}
    .hud-block.right{align-items:flex-end;}
    .hud-lbl{font-family:'Press Start 2P',monospace;font-size:6px;color:#6b5ea0;letter-spacing:1px;}
    .hud-num{font-family:'Press Start 2P',monospace;font-size:12px;color:#fff;}
    .hud-lives{font-size:14px;letter-spacing:2px;}

    /* ── canvas container ── */
    #canvas-wrap{
      flex:1;display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;
      padding:0 0 6px;
    }
    canvas{display:block;image-rendering:pixelated;}

    /* ── overlay ── */
    #overlay{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;
      background:rgba(13,8,32,0.88);
      backdrop-filter:blur(2px);
    }
    #ov-emoji{font-size:48px;line-height:1;animation:bounce 0.8s ease-in-out infinite alternate;}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    #ov-title{
      font-family:'Press Start 2P',monospace;font-size:15px;color:#fff;
      text-align:center;line-height:1.8;
      text-shadow:0 0 20px rgba(200,160,76,0.6);
    }
    #ov-sub{
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px;color:#9b88c8;text-align:center;
      letter-spacing:1px;line-height:1.8;text-transform:uppercase;
    }
    #play-btn{
      font-family:'Press Start 2P',monospace;font-size:10px;
      background:linear-gradient(135deg,#C9A84C,#8a7035);
      color:#0d0820;border:none;border-radius:6px;
      padding:12px 28px;cursor:pointer;letter-spacing:1px;
      box-shadow:0 0 20px #C9A84C50;
      animation:pulse-btn 1.2s ease-in-out infinite alternate;
    }
    @keyframes pulse-btn{from{box-shadow:0 0 10px #C9A84C40}to{box-shadow:0 0 28px #C9A84C80}}
    #play-btn:active{transform:scale(0.96);}
    #ov-hi{font-family:'Press Start 2P',monospace;font-size:7px;color:#C9A84C;letter-spacing:1px;}

    /* ── tap zone ── */
    #tap-zone{
      height:52px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      gap:16px;
      padding:0 16px 8px;
    }
    .tap-btn{
      flex:1;max-width:160px;height:40px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:10px;
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px;font-weight:700;letter-spacing:2px;
      color:rgba(255,255,255,0.7);text-transform:uppercase;
      cursor:pointer;transition:all 0.1s;
    }
    .tap-btn:active{background:rgba(255,255,255,0.15);transform:scale(0.97);}
    #jump-btn{border-color:rgba(100,200,100,0.3);color:#90ee90;}
    #slide-btn{border-color:rgba(100,150,255,0.3);color:#90b0ff;}
  </style>
</head>
<body>

<div id="topbar">
  <a id="back-btn" href="/cruce-reynosa/">&#8592; Ver puente</a>
  <div id="topbar-brand">Cruce RNS</div>
  <div id="topbar-score" id="top-sc">0</div>
</div>

<div id="root">
  <div id="hud">
    <div class="hud-block">
      <div class="hud-lbl">METROS</div>
      <div class="hud-num" id="sc-disp">0</div>
    </div>
    <div class="hud-block center">
      <div class="hud-lbl">VIDAS</div>
      <div class="hud-lives" id="lives-disp">❤️❤️❤️</div>
    </div>
    <div class="hud-block right">
      <div class="hud-lbl">RÉCORD</div>
      <div class="hud-num" id="hi-disp">0</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gc"></canvas>
    <div id="overlay">
      <div id="ov-emoji">🏃</div>
      <div id="ov-title">BORDER<br>RUNNER</div>
      <div id="ov-sub">¡Salta y agáchate!<br>No te atrapen los agentes</div>
      <button id="play-btn">▶ CORRER</button>
      <div id="ov-hi"></div>
    </div>
  </div>

  <div id="tap-zone">
    <button class="tap-btn" id="jump-btn">▲ SALTAR</button>
    <button class="tap-btn" id="slide-btn">▼ AGACHAR</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════
   CANVAS SETUP
══════════════════════════════════════════════ */
var wrap = document.getElementById('canvas-wrap');
var canvas = document.getElementById('gc');
var ctx = canvas.getContext('2d');

function resize(){
  var W = Math.min(wrap.clientWidth - 8, 420);
  var H = Math.min(wrap.clientHeight - 6, 260);
  canvas.width  = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', function(){ resize(); if(!running) drawIdle(); });

/* ══════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════ */
var GROUND_RATIO = 0.72;   /* ground Y as fraction of height */
var GRAVITY      = 0.55;
var JUMP_VY      = -12;
var SLIDE_DUR    = 38;      /* frames */

/* ══════════════════════════════════════════════
   PALETA — PIXEL ART COLORS
══════════════════════════════════════════════ */
var SKY_TOP    = '#1a0a2e';
var SKY_BOT    = '#2d1060';
var MOON_C     = '#fffde0';
var STAR_C     = '#ffffff';
var GROUND_C   = '#3d2b6b';
var GROUND_LN  = '#5a3fa0';
var STRIPE_C   = '#4a3380';

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
var running = false, gameOver = false;
var score = 0, hiScore = 0, lives = 3;
var frame = 0, speed = 5, spawnTimer = 0, spawnInterval = 70;
var scrollX = 0;

/* Player */
var player = { x:0, y:0, vy:0, onGround:true, sliding:false, slideTimer:0,
               w:28, h:42, animFrame:0, animTimer:0, invincible:0 };

/* Obstacles array */
var obstacles = [];

/* ICE agent */
var agent = { x:0, y:0, animFrame:0, animTimer:0, catchAnim:0 };

/* Stars */
var stars = [];
for(var i=0;i<30;i++) stars.push({ x:Math.random(), y:Math.random()*0.55, s:Math.random()*2+0.5 });

/* Background buildings */
var buildings = [];
for(var b=0;b<8;b++) buildings.push({
  x: b*120 + Math.random()*60,
  w: 40+Math.random()*50, h: 40+Math.random()*70,
  c: ['#1e0f40','#2a1555','#22106a'][Math.floor(Math.random()*3)]
});

try{ hiScore = parseInt(localStorage.getItem('cruce-ice-hi')||'0',10)||0; }catch(e){}

/* ══════════════════════════════════════════════
   UI REFS
══════════════════════════════════════════════ */
var overlay  = document.getElementById('overlay');
var ovEmoji  = document.getElementById('ov-emoji');
var ovTitle  = document.getElementById('ov-title');
var ovSub    = document.getElementById('ov-sub');
var playBtn  = document.getElementById('play-btn');
var scDisp   = document.getElementById('sc-disp');
var hiDisp   = document.getElementById('hi-disp');
var livesDisp= document.getElementById('lives-disp');
var ovHi     = document.getElementById('ov-hi');
var topSc    = document.getElementById('topbar-score');
hiDisp.textContent = hiScore;

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function groundY(){ return Math.floor(canvas.height * GROUND_RATIO); }
function clr(h){ return h; }

/* Draw a pixel-art rectangle */
function px(x,y,w,h,c){
  ctx.fillStyle=c;
  ctx.fillRect(Math.floor(x),Math.floor(y),Math.floor(w),Math.floor(h));
}

/* Draw pixel-art person (runner) */
function drawRunner(x, y, anim, sliding, invincible){
  if(invincible && Math.floor(invincible/3)%2===0) return; /* blink */

  var gnd = groundY();
  var ph  = sliding ? 22 : 42;
  var pw  = sliding ? 36 : 28;
  var py  = sliding ? gnd - 22 : y;
  var px0 = x - pw/2;

  /* legs animation */
  var legOff = sliding ? 0 : (anim%2===0 ? 4 : -4);

  if(!sliding){
    /* back leg */
    px(px0+8,  py+26, 8, 16, '#4a3080'); /* pants */
    px(px0+8,  py+40, 8,  4, '#c8a06a'); /* shoe */
    /* front leg */
    px(px0+12+legOff, py+26, 8, 16, '#5a3a9a');
    px(px0+12+legOff, py+40, 8,  4, '#e0b87a');
  } else {
    /* slide legs */
    px(px0,    py+10, 16, 10, '#4a3080');
    px(px0+16, py+10, 20, 10, '#5a3a9a');
    px(px0+34, py+10,  6,  4, '#e0b87a');
  }

  /* body — shirt */
  if(!sliding){
    px(px0+4, py+12, 20, 16, '#e05030'); /* red shirt */
    /* arm back */
    px(px0,   py+14, 8, 10, '#e05030');
    /* arm front */
    px(px0+20-legOff, py+14, 8, 10, '#e05030');
    /* head */
    px(px0+6, py,    16, 14, '#c8a06a'); /* skin */
    px(px0+6, py,    16,  6, '#2a1a6a'); /* hair */
    /* eyes */
    px(px0+18, py+5,  3, 3, '#222');
    /* backpack */
    px(px0+1, py+12, 7, 12, '#2060b0');
  } else {
    px(px0+2, py, 20, 12, '#e05030');
    px(px0+22,py,  2, 10, '#c8a06a'); /* arm out */
    /* head */
    px(px0+2, py-2, 14, 12, '#c8a06a');
    px(px0+2, py-2, 14,  5, '#2a1a6a');
    px(px0+14,py+2,  3,  3, '#222');
  }
}

/* Draw ICE agent (green uniform) */
function drawAgent(x, y, anim, catchAnim){
  var gnd = groundY();
  var legOff = anim%2===0 ? 5 : -5;
  var px0 = x - 14;

  if(catchAnim > 0){
    /* catching pose — arms raised */
    px(px0+2,  gnd-42, 24, 14, '#1a6e1a'); /* body */
    px(px0+0,  gnd-44,  8, 22, '#1a6e1a'); /* left arm up */
    px(px0+18, gnd-44,  8, 22, '#1a6e1a'); /* right arm up */
    px(px0+4,  gnd-56, 18, 14, '#c8a06a'); /* head */
    px(px0+4,  gnd-56, 18,  6, '#1a4010'); /* hat */
    px(px0+2,  gnd-57, 24,  4, '#2a6020'); /* hat brim */
    px(px0+6,  gnd-28, 10, 16, '#1a4a1a'); /* pants */
    px(px0+16, gnd-28, 10, 16, '#1a4a1a');
    px(px0+6,  gnd-14,  8,  4, '#222');
    px(px0+16, gnd-14,  8,  4, '#222');
    return;
  }

  /* back leg */
  px(px0+6,  gnd-16, 8, 16, '#1a4a1a');
  px(px0+6,  gnd-2,  8,  4, '#222');
  /* front leg */
  px(px0+10+legOff, gnd-16, 8, 16, '#1a4a1a');
  px(px0+10+legOff, gnd-2,  8,  4, '#222');
  /* body */
  px(px0+2,  gnd-32, 24, 18, '#1a6e1a');
  /* arms */
  px(px0-2,  gnd-30,  8, 12, '#1a6e1a');
  px(px0+22-legOff, gnd-30, 8, 12, '#1a6e1a');
  /* badge shine */
  px(px0+12, gnd-26,  6,  5, '#ffd700');
  /* head */
  px(px0+4,  gnd-46, 18, 14, '#c8a06a');
  px(px0+4,  gnd-46, 18,  6, '#1a4010'); /* cap */
  px(px0+2,  gnd-47, 22,  4, '#2a6020'); /* brim */
  /* sunglasses */
  px(px0+6,  gnd-40,  6,  4, '#111');
  px(px0+14, gnd-40,  6,  4, '#111');
  px(px0+12, gnd-40,  2,  3, '#555');
  /* "ICE" text implied by white stripes on shoulder */
  px(px0+3,  gnd-32,  4,  2, '#fff');
  px(px0+3,  gnd-29,  4,  2, '#fff');
  px(px0+3,  gnd-26,  4,  2, '#fff');
}

/* Draw obstacle */
function drawObstacle(ob){
  var gnd = groundY();
  if(ob.type==='barrel'){
    /* barrel */
    px(ob.x, gnd-ob.h, ob.w, ob.h, '#8b4513');
    px(ob.x+2, gnd-ob.h, ob.w-4, 4, '#a0522d');
    px(ob.x+2, gnd-ob.h/2-2, ob.w-4, 4, '#a0522d');
    px(ob.x+2, gnd-4, ob.w-4, 4, '#a0522d');
    /* metal rings */
    px(ob.x, gnd-ob.h+6, ob.w, 3, '#654321');
    px(ob.x, gnd-8, ob.w, 3, '#654321');
  } else if(ob.type==='wire'){
    /* barbed wire fence */
    px(ob.x+ob.w/2-2, gnd-ob.h, 4, ob.h, '#999'); /* post */
    for(var wi=0;wi<ob.h;wi+=10){
      px(ob.x, gnd-ob.h+wi, ob.w, 3, '#bbb');
      /* barbs */
      px(ob.x+4,  gnd-ob.h+wi-3, 4, 3, '#888');
      px(ob.x+12, gnd-ob.h+wi-3, 4, 3, '#888');
      px(ob.x+20, gnd-ob.h+wi-3, 4, 3, '#888');
    }
  } else if(ob.type==='car'){
    /* CBP patrol car (low, must slide under) */
    px(ob.x, gnd-ob.h, ob.w, ob.h, '#1a6e1a');
    px(ob.x+4, gnd-ob.h-8, ob.w-8, 10, '#2a8e2a'); /* roof */
    px(ob.x+6, gnd-ob.h-6, ob.w-12, 8, '#7ecfff'); /* windshield */
    px(ob.x, gnd-6, ob.w, 6, '#333'); /* undercarriage */
    px(ob.x+4, gnd-4, 10, 4, '#555'); px(ob.x+ob.w-14, gnd-4, 10, 4, '#555'); /* wheels */
    /* lights */
    px(ob.x+2, gnd-ob.h-8, 8, 4, '#ff4444');
    px(ob.x+ob.w-10, gnd-ob.h-8, 8, 4, '#4444ff');
    /* "ICE" */
    px(ob.x+10, gnd-ob.h+6, 4, 2, '#fff');
    px(ob.x+10, gnd-ob.h+10, 4, 2, '#fff');
    px(ob.x+10, gnd-ob.h+14, 4, 2, '#fff');
  } else if(ob.type==='cactus'){
    px(ob.x+6, gnd-ob.h, 12, ob.h, '#3a8a3a');
    px(ob.x, gnd-ob.h+14, 8, 16, '#3a8a3a');
    px(ob.x, gnd-ob.h+10, 6, 6, '#3a8a3a');
    px(ob.x+18, gnd-ob.h+20, 8, 12, '#3a8a3a');
    px(ob.x+22, gnd-ob.h+16, 6, 6, '#3a8a3a');
    /* spines */
    for(var si=0;si<ob.h;si+=8){ px(ob.x+5, gnd-ob.h+si, 2, 2, '#5faf5f'); }
  } else {
    /* default box */
    px(ob.x, gnd-ob.h, ob.w, ob.h, '#888');
  }
}

/* Draw background */
function drawBG(){
  var W=canvas.width, H=canvas.height, gnd=groundY();

  /* sky gradient via two rects */
  px(0, 0, W, gnd*0.6, SKY_TOP);
  px(0, gnd*0.6, W, gnd*0.4, SKY_BOT);

  /* stars */
  stars.forEach(function(s){
    var tx=(s.x*W - scrollX*0.05) % W;
    if(tx<0) tx+=W;
    px(tx, s.y*gnd, s.s, s.s, STAR_C);
  });

  /* moon */
  ctx.fillStyle = MOON_C;
  ctx.beginPath();
  ctx.arc(W*0.82, H*0.12, 18, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = SKY_BOT;
  ctx.beginPath();
  ctx.arc(W*0.84, H*0.10, 16, 0, Math.PI*2);
  ctx.fill();

  /* buildings */
  buildings.forEach(function(bd){
    var bx = ((bd.x - scrollX*0.15) % (W+60));
    if(bx < -80) bx += W+80;
    px(bx, gnd-bd.h, bd.w, bd.h, bd.c);
    /* windows */
    for(var wy=6;wy<bd.h-6;wy+=14){
      for(var wx=4;wx<bd.w-4;wx+=12){
        if(Math.random()<0.5) px(bx+wx, gnd-bd.h+wy, 6, 8, '#ffd70030');
        else px(bx+wx, gnd-bd.h+wy, 6, 8, '#00000060');
      }
    }
  });

  /* Rio Bravo hint */
  px(0, gnd-4, W, 6, '#1a40a0');
  px(0, gnd-2, W, 4, '#2255bb');

  /* ground */
  px(0, gnd, W, H-gnd, GROUND_C);
  /* ground stripe */
  var stripeX = (- scrollX*1.0) % 60;
  for(var sx=stripeX-60;sx<W;sx+=60){
    px(sx, gnd, 30, 2, STRIPE_C);
  }
  /* ground line */
  px(0, gnd, W, 2, GROUND_LN);

  /* US flag hint on far right edge */
  px(W-18, gnd-44, 3, 40, '#aaa');
  px(W-15, gnd-44, 18, 10, '#cc0000');
  px(W-15, gnd-38, 18,  4, '#fff');
  px(W-15, gnd-34, 18,  4, '#cc0000');
  px(W-15, gnd-44,  8, 10, '#003399');
}

/* ══════════════════════════════════════════════
   SPAWN OBSTACLES
══════════════════════════════════════════════ */
var OB_TYPES = [
  {type:'barrel', w:24, h:40, slidable:false},
  {type:'wire',   w:30, h:50, slidable:false},
  {type:'cactus', w:28, h:52, slidable:false},
  {type:'car',    w:60, h:22, slidable:true},  /* must slide */
];

function spawnObstacle(){
  var W = canvas.width;
  var t = OB_TYPES[Math.floor(Math.random()*OB_TYPES.length)];
  obstacles.push({
    type: t.type, x: W+10, w: t.w, h: t.h, slidable: t.slidable
  });
}

/* ══════════════════════════════════════════════
   COLLISION
══════════════════════════════════════════════ */
function getPlayerRect(){
  var gnd = groundY();
  var ph = player.sliding ? 22 : 42;
  var pw = player.sliding ? 36 : 22;
  return { x: player.x - pw/2 + 4, y: player.y, w: pw - 8, h: ph };
}

function rectsOverlap(a, ob){
  var gnd = groundY();
  var bx = ob.x + 4, by = gnd - ob.h, bw = ob.w - 8, bh = ob.h;
  return !(a.x + a.w < bx || a.x > bx + bw || a.y + a.h < by || a.y > by + bh);
}

/* ══════════════════════════════════════════════
   GAME LOOP
══════════════════════════════════════════════ */
var raf;
function tick(){
  if(!running){ return; }
  frame++;
  scrollX += speed;

  /* player physics */
  if(!player.onGround){
    player.vy += GRAVITY;
    player.y  += player.vy;
    var gnd = groundY();
    var ph  = player.sliding ? 22 : 42;
    if(player.y + ph >= gnd){
      player.y = gnd - ph;
      player.vy = 0;
      player.onGround = true;
    }
  }

  /* slide timer */
  if(player.sliding){
    player.slideTimer--;
    if(player.slideTimer <= 0){ player.sliding = false; player.y = groundY()-42; }
  }

  /* player anim */
  player.animTimer++;
  if(player.animTimer >= 6){ player.animTimer=0; player.animFrame=(player.animFrame+1)%4; }

  /* agent anim */
  agent.animTimer++;
  if(agent.animTimer >= 7){ agent.animTimer=0; agent.animFrame=(agent.animFrame+1)%4; }
  if(agent.catchAnim>0) agent.catchAnim--;

  /* invincible frames */
  if(player.invincible>0) player.invincible--;

  /* score */
  score = Math.floor(frame * speed / 50);
  scDisp.textContent = score;
  topSc.textContent = score;

  /* speed ramp */
  speed = 5 + Math.floor(score / 200) * 0.8;
  spawnInterval = Math.max(38, 70 - Math.floor(score/150)*3);

  /* spawn */
  spawnTimer++;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnObstacle();
  }

  /* move obstacles */
  obstacles = obstacles.filter(function(ob){ return ob.x + ob.w > -20; });
  obstacles.forEach(function(ob){ ob.x -= speed; });

  /* collision */
  if(player.invincible === 0){
    var pr = getPlayerRect();
    for(var i=0;i<obstacles.length;i++){
      var ob = obstacles[i];
      if(ob.slidable && !player.sliding && rectsOverlap(pr, ob)){
        hit(ob, i); break;
      } else if(!ob.slidable && rectsOverlap(pr, ob)){
        hit(ob, i); break;
      }
    }
  }

  draw();
  raf = requestAnimationFrame(tick);
}

function hit(ob, idx){
  lives--;
  obstacles.splice(idx, 1);
  player.invincible = 90;
  agent.catchAnim = 40;
  updateLives();
  if(lives <= 0){
    endGame();
  }
}

function updateLives(){
  var s='';
  for(var i=0;i<lives;i++) s+='❤️';
  for(var j=lives;j<3;j++) s+='🖤';
  livesDisp.textContent = s;
}

/* ══════════════════════════════════════════════
   DRAW
══════════════════════════════════════════════ */
function draw(){
  var W=canvas.width, H=canvas.height, gnd=groundY();
  ctx.clearRect(0,0,W,H);
  drawBG();

  /* obstacles */
  obstacles.forEach(drawObstacle);

  /* player */
  var ph = player.sliding ? 22 : 42;
  drawRunner(player.x, player.y, player.animFrame, player.sliding, player.invincible);

  /* agent */
  drawAgent(agent.x, agent.y, agent.animFrame, agent.catchAnim);

  /* distance label */
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.font='bold 9px monospace';
  ctx.fillText('🇺🇸 EE.UU', W-54, gnd-50);
  ctx.fillText('🇲🇽 MX', 6, gnd-50);
}

function drawIdle(){
  var W=canvas.width, H=canvas.height, gnd=groundY();
  ctx.clearRect(0,0,W,H);
  drawBG();
  drawRunner(W*0.35, gnd-42, 0, false, 0);
  drawAgent(W*0.12, gnd, 0, 0);
}

/* ══════════════════════════════════════════════
   START / END
══════════════════════════════════════════════ */
function startGame(){
  var W=canvas.width, gnd=groundY();
  score=0; frame=0; lives=3; speed=5; spawnTimer=0; spawnInterval=70; scrollX=0;
  obstacles=[];
  player = { x: W*0.35, y: gnd-42, vy:0, onGround:true, sliding:false, slideTimer:0,
             w:28, h:42, animFrame:0, animTimer:0, invincible:0 };
  agent  = { x: W*0.1, y: gnd, animFrame:0, animTimer:0, catchAnim:0 };
  running=true; gameOver=false;
  updateLives();
  overlay.style.display='none';
  cancelAnimationFrame(raf);
  tick();
}

function endGame(){
  running=false; gameOver=true;
  cancelAnimationFrame(raf);
  agent.catchAnim=999;

  if(score > hiScore){
    hiScore=score;
    try{ localStorage.setItem('cruce-ice-hi', hiScore); }catch(e){}
  }
  hiDisp.textContent=hiScore;

  ovEmoji.textContent='🚨';
  ovTitle.textContent='¡GAME OVER!';
  var msgs=['¡Te atraparon en la frontera!','¡No llegaste al otro lado!','¡Tan cerca y tan lejos!','Next time, use Ready Lane 😂'];
  ovSub.textContent = msgs[Math.floor(Math.random()*msgs.length)];
  ovHi.textContent = 'RÉCORD: ' + hiScore + ' metros';
  playBtn.textContent='▶ INTENTAR DE NUEVO';
  overlay.style.display='flex';

  /* final frame with agent catching */
  var gnd=groundY();
  agent.x = player.x - 30;
  draw();
}

/* ══════════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════════ */
function doJump(){
  if(!running){ startGame(); return; }
  if(player.onGround && !player.sliding){
    player.vy = JUMP_VY;
    player.onGround = false;
  }
}

function doSlide(){
  if(!running){ startGame(); return; }
  if(player.onGround && !player.sliding){
    player.sliding = true;
    player.slideTimer = SLIDE_DUR;
    player.y = groundY() - 22;
  }
}

/* keyboard */
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowUp'   || e.key===' ' || e.key==='w'){ doJump(); e.preventDefault(); }
  if(e.key==='ArrowDown' || e.key==='s'){ doSlide(); e.preventDefault(); }
  if(!running && e.key==='Enter'){ startGame(); }
});

/* buttons */
document.getElementById('jump-btn').addEventListener('click', doJump);
document.getElementById('slide-btn').addEventListener('click', doSlide);
playBtn.addEventListener('click', startGame);

/* touch swipe on canvas */
var touchY0=0;
canvas.addEventListener('touchstart', function(e){ touchY0=e.touches[0].clientY; e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend', function(e){
  var dy = e.changedTouches[0].clientY - touchY0;
  if(dy < -15){ doJump(); }
  else if(dy > 15){ doSlide(); }
  else { doJump(); } /* tap = jump */
  e.preventDefault();
},{passive:false});

/* back btn */
document.getElementById('back-btn').addEventListener('click', function(){
  running=false; cancelAnimationFrame(raf);
});

/* ── init ── */
drawIdle();
ovHi.textContent = hiScore > 0 ? 'RÉCORD: '+hiScore+' metros' : '';
hiDisp.textContent = hiScore;

})();
</script>
</body>
</html>
