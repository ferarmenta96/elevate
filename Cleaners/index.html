<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Cleaners RGV</title>

<link id="manifest-link" rel="manifest">
<meta name="theme-color" content="#1a4a7c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cleaners RGV">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --blue-deep:  #1a4a7c;
  --blue-mid:   #1a5fa8;
  --blue-light: #4a90d9;
  --blue-pale:  #e8f2fb;
  --blue-soft:  #d0e7f7;
  --gold:       #c9a84c;
  --gold-light: #f0d887;
  --white:      #ffffff;
  --gray-light: #f4f7fb;
  --gray-mid:   #8a9bb5;
  --gray-dark:  #2c3e5a;
  --text-main:  #1a2b45;
  --text-muted: #5a6f8a;
  --danger:     #d63031;
  --success:    #00b894;
  --shadow-card: 0 4px 24px rgba(26,74,124,0.12);
  --shadow-btn:  0 4px 16px rgba(26,95,168,0.35);
  --radius:     14px;
  --radius-sm: 8px;
  --font-display: 'Playfair Display', serif;
  --font-body:    'DM Sans', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: var(--gray-light); color: var(--text-main); min-height: 100vh; }

/* TOPBAR */
.topbar { background: var(--blue-deep); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; max-width: 700px; margin: 0 auto; padding: 12px 20px; }
.logo-wrap { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 38px; height: 38px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.logo-text { display: flex; flex-direction: column; line-height: 1.1; color: white; }
.logo-text span:first-child { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
.logo-text span:last-child  { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }

.nav-tabs { display: flex; gap: 4px; }
.tab-btn { padding: 7px 14px; border-radius: 20px; border: none; background: transparent; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 13px; font-weight: 500; }
.tab-btn.active { background: var(--gold); color: var(--blue-deep); font-weight: 600; }

/* VIEWS */
.view { display: none; }
.view.active { display: block; }

/* HERO */
.hero { background: linear-gradient(160deg, var(--blue-deep) 0%, var(--blue-mid) 60%, var(--blue-light) 100%); padding: 48px 20px; text-align: center; color: white; }
.hero h1 { font-family: var(--font-display); font-size: 32px; margin-bottom: 10px; }
.hero-cta { background: var(--gold); color: var(--blue-deep); border: none; padding: 14px 36px; border-radius: 30px; font-weight: 700; cursor: pointer; margin-top: 20px; box-shadow: var(--shadow-btn); }

/* FORMS */
.section { max-width: 700px; margin: 0 auto; padding: 20px; }
.form-card { background: white; border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow-card); }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid var(--blue-soft); border-radius: var(--radius-sm); outline: none; }

.service-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.service-option { padding: 15px; border: 2px solid var(--blue-soft); border-radius: var(--radius-sm); text-align: center; cursor: pointer; }
.service-option.selected { border-color: var(--blue-mid); background: var(--blue-pale); }

.extras-check { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.extra-toggle { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1.5px solid var(--blue-soft); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
.extra-toggle.checked { border-color: var(--blue-mid); background: var(--blue-pale); }

.time-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.time-slot { padding: 10px 5px; border: 1.5px solid var(--blue-soft); border-radius: var(--radius-sm); text-align: center; cursor: pointer; font-size: 13px; }
.time-slot.selected { background: var(--blue-mid); color: white; border-color: var(--blue-mid); }
.time-slot.occupied { background: #eee; color: #bbb; text-decoration: line-through; cursor: not-allowed; }

.price-summary { background: var(--blue-pale); padding: 15px; border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
.submit-btn { width: 100%; background: var(--blue-mid); color: white; padding: 16px; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 25px; border-radius: 30px; transition: 0.3s; z-index: 1000; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); }

.success-screen { display: none; text-align: center; padding: 40px 20px; }
.success-screen.show { display: block; }
</style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <div class="logo-wrap">
      <div class="logo-icon">🧹</div>
      <div class="logo-text"><span>House Cleaners</span><span>RGV</span></div>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-nav-home" onclick="showView('home')">Inicio</button>
      <button class="tab-btn" id="btn-nav-booking" onclick="showView('booking')">Agendar</button>
    </div>
  </div>
</nav>

<div id="view-home" class="view active">
  <div class="hero">
    <h1>Tired and overwhelmed?</h1>
    <p>Let us handle the cleaning.</p>
    <button class="hero-cta" onclick="showView('booking')">Agenda tu Limpieza →</button>
  </div>
  <div class="section">
    <h2 style="margin-bottom:15px">Nuestros Servicios</h2>
    <p>Calidad garantizada en cada rincón de tu hogar en el RGV.</p>
  </div>
</div>

<div id="view-booking" class="view">
  <div class="section">
    <div id="booking-form-wrap">
      <div class="form-card">
        <h2>Nueva Cita</h2>
        <div class="form-group">
          <label>Tipo de Servicio</label>
          <div class="service-selector">
            <div class="service-option selected" id="opt-basic" onclick="selectService('basic')">🧺 Basic</div>
            <div class="service-option" id="opt-deep" onclick="selectService('deep')">✨ Deep</div>
          </div>
        </div>

        <div class="form-group">
          <label>Tamaño del Hogar</label>
          <select id="tamano" onchange="calcTotal()"></select>
        </div>

        <div class="form-group">
          <label>Extras</label>
          <div class="extras-check">
            <label class="extra-toggle"><input type="checkbox" value="20" data-label="Baño" onchange="updateExtraUI(this)"> 🚽 Baño +$20</label>
            <label class="extra-toggle"><input type="checkbox" value="20" data-label="Refri" onchange="updateExtraUI(this)"> 🧊 Refri +$20</label>
          </div>
        </div>

        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="fecha" onchange="cargarHorarios()">
        </div>

        <div id="horarios-wrap" style="display:none">
          <label style="font-size:12px; font-weight:600; color:var(--text-muted)">HORA DISPONIBLE</label>
          <div class="time-slots" id="time-slots" style="margin-top:5px"></div>
        </div>

        <div class="form-group" style="margin-top:15px">
          <label>Nombre</label>
          <input type="text" id="nombre">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="telefono">
        </div>
        <div class="form-group">
          <label>Dirección</label>
          <input type="text" id="direccion">
        </div>

        <div class="price-summary">
          <span>Total:</span>
          <strong id="total-display">$100</strong>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="enviarCita()">Confirmar Cita</button>
      </div>
    </div>

    <div id="success-screen" class="success-screen">
      <div style="font-size:50px">✅</div>
      <h2>¡Cita Agendada!</h2>
      <p>Nos vemos pronto.</p>
      <button class="hero-cta" onclick="resetForm()">Agendar otra</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// --- CONFIGURACIÓN ---
var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzo8nApLan4FL2juOxsG3tP8y0WgGpid4UWQv7dRji-mHpCFb8Aq-yicOZR_JvVuN62/exec"; 
var selectedService = 'basic';
var selectedHour = null;
var total = 100;
var PRICES = { basic: [100, 130, 160], deep: [120, 160, 180] };
var SIZES = ['1-2 Rec. / 1 Baño', '3 Rec. / 2 Baños', '4 Rec. / 2 Baños'];

// --- FUNCIONES GLOBALES ---
function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById('view-' + name).classList.add('active');
    document.getElementById('btn-nav-' + name).classList.add('active');
    window.scrollTo(0,0);
}

function selectService(type) {
    selectedService = type;
    document.getElementById('opt-basic').classList.toggle('selected', type === 'basic');
    document.getElementById('opt-deep').classList.toggle('selected', type === 'deep');
    updateTamanoOptions();
}

function updateTamanoOptions() {
    var prices = PRICES[selectedService];
    var sel = document.getElementById('tamano');
    sel.innerHTML = SIZES.map((s, i) => `<option value="${prices[i]}">${s} - $${prices[i]}</option>`).join('');
    calcTotal();
}

function updateExtraUI(checkbox) {
    checkbox.parentElement.classList.toggle('checked', checkbox.checked);
    calcTotal();
}

function calcTotal() {
    var base = parseInt(document.getElementById('tamano').value) || 0;
    var extras = 0;
    document.querySelectorAll('.extras-check input:checked').forEach(cb => extras += parseInt(cb.value));
    total = base + extras;
    document.getElementById('total-display').innerText = '$' + total;
}

function cargarHorarios() {
    var fecha = document.getElementById('fecha').value;
    if(!fecha) return;
    
    document.getElementById('horarios-wrap').style.display = 'block';
    var container = document.getElementById('time-slots');
    container.innerHTML = 'Cargando...';

    // Simulación de carga
    setTimeout(() => {
        container.innerHTML = '';
        for(let h=8; h<=18; h++) {
            let div = document.createElement('div');
            div.className = 'time-slot';
            div.innerText = h + ':00';
            div.onclick = function() {
                document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                div.classList.add('selected');
                selectedHour = h + ':00';
            };
            container.appendChild(div);
        }
    }, 300);
}

function enviarCita() {
    var nombre = document.getElementById('nombre').value;
    var tel = document.getElementById('telefono').value;
    var dir = document.getElementById('direccion').value;
    var fecha = document.getElementById('fecha').value;

    if(!nombre || !tel || !dir || !fecha || !selectedHour) {
        showToast("Faltan datos requeridos", "error");
        return;
    }

    // Aquí iría el fetch a tu Excel
    document.getElementById('booking-form-wrap').style.display = 'none';
    document.getElementById('success-screen').classList.add('show');
}

function resetForm() {
    location.reload();
}

function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.innerText = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 3000);
}

// Inicializar
window.onload = () => {
    updateTamanoOptions();
    var today = new Date().toISOString().split('T')[0];
    document.getElementById('fecha').min = today;
};
</script>
</body>
</html>
