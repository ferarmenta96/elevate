<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Cleaners RGV</title>

<style>
body { font-family: Arial; margin:0; background:#f4f7fb; }
.view { display:none; padding:20px; }
.view.active { display:block; }
button { padding:10px 20px; cursor:pointer; }

.hero { background:#1a4a7c; color:white; text-align:center; padding:40px; }

.service-option, .extra-toggle, .time-slot {
  border:1px solid #ccc; padding:10px; margin:5px; cursor:pointer;
}

.selected { background:#1a5fa8; color:white; }
.checked { background:#d0e7f7; }

.time-slot.occupied { opacity:0.3; cursor:not-allowed; }
</style>
</head>
<body>

<!-- NAV -->
<button onclick="showView('home')">Inicio</button>
<button onclick="showView('booking')">Agendar</button>

<!-- HOME -->
<div id="view-home" class="view active">
  <div class="hero">
    <h1>House Cleaners RGV</h1>
    <button onclick="showView('booking')">Agendar</button>
  </div>
</div>

<!-- BOOKING -->
<div id="view-booking" class="view">

  <h2>Agendar</h2>

  <!-- SERVICIO -->
  <div>
    <div id="opt-basic" class="service-option selected" onclick="selectService('basic')">Basic</div>
    <div id="opt-deep" class="service-option" onclick="selectService('deep')">Deep</div>
  </div>

  <!-- TAMAÑO -->
  <select id="tamano" onchange="calcTotal()"></select>

  <!-- EXTRAS -->
  <div class="extras-check">
    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Baño Extra"> 🚽 Baño Extra +$20
    </label>

    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Refrigerador"> 🧊 Refrigerador +$20
    </label>

    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Ventanas"> 🪟 Ventanas +$20
    </label>

    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Microwave"> 📡 Microwave +$20
    </label>
  </div>

  <!-- FECHA -->
  <input type="date" id="fecha" onchange="cargarHorarios()">

  <!-- HORAS -->
  <div id="horarios-wrap" style="display:none;">
    <div id="time-slots"></div>
  </div>

  <!-- DATOS -->
  <input id="nombre" placeholder="Nombre"><br>
  <input id="telefono" placeholder="Telefono"><br>
  <input id="direccion" placeholder="Direccion"><br>

  <h3 id="total-display">$100</h3>

  <button onclick="enviarCita()">Confirmar</button>

</div>

<script>
(function() {
  'use strict';

  var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzo8nApLan4FL2juOxsG3tP8y0WgGpid4UWQv7dRji-mHpCFb8Aq-yicOZR_JvVuN62/exec";

  var selectedService = 'basic';
  var selectedHour = null;
  var total = 100;

  var PRICES = {
    basic: [100, 130, 160],
    deep:  [120, 160, 180]
  };

  var SIZES = ['1-2 Recamaras / 1 Bano', '3 Recamaras / 2 Banos', '4 Recamaras / 2 Banos'];

  var today = new Date().toISOString().split('T')[0];
  document.getElementById('fecha').min = today;

  updateTamanoOptions();

  // NAV
  window.showView = function(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    document.getElementById('view-' + name).classList.add('active');

    var idx = ['home', 'booking'].indexOf(name);
    if (idx >= 0) document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  };

  // SERVICE
  window.selectService = function(type) {
    selectedService = type;
    document.getElementById('opt-basic').classList.toggle('selected', type === 'basic');
    document.getElementById('opt-deep').classList.toggle('selected', type === 'deep');
    updateTamanoOptions();
  };

  function updateTamanoOptions() {
    var prices = PRICES[selectedService];
    var sel = document.getElementById('tamano');

    sel.innerHTML = SIZES.map((s, i) =>
      `<option value="${prices[i]}">${s} -- $${prices[i]}</option>`
    ).join('');

    calcTotal();
  }

  // 🔥 FIX REAL
  window.toggleExtra = function(event) {
    let label = event.currentTarget;
    let cb = label.querySelector('input');

    if (!cb) return;

    cb.checked = !cb.checked;
    label.classList.toggle('checked', cb.checked);

    calcTotal();
  };

  // TOTAL
  window.calcTotal = function() {
    var base = parseInt(document.getElementById('tamano').value) || 100;
    var extras = 0;

    document.querySelectorAll('.extras-check input').forEach(cb => {
      if (cb.checked) extras += parseInt(cb.value);
    });

    total = base + extras;
    document.getElementById('total-display').textContent = '$' + total;
  };

  // HORARIOS
  window.cargarHorarios = function() {
    var fecha = document.getElementById('fecha').value;
    if (!fecha) return;

    selectedHour = null;

    var wrap = document.getElementById('horarios-wrap');
    var container = document.getElementById('time-slots');

    wrap.style.display = 'block';
    container.innerHTML = '<div class="loading-slots">Verificando disponibilidad...</div>';

    setTimeout(() => renderSlots([9,14]), 400);
  };

  function renderSlots(ocupadasList) {
    var container = document.getElementById('time-slots');
    container.innerHTML = '';

    var ocupadas = new Set(ocupadasList.map(h => String(h)));

    for (let h = 8; h <= 18; h++) {
      let slot = document.createElement('div');
      let key = String(h);

      slot.className = 'time-slot' + (ocupadas.has(key) ? ' occupied' : '');
      slot.textContent = h + ':00';

      if (!ocupadas.has(key)) {
        slot.onclick = function() {
          document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
          slot.classList.add('selected');
          selectedHour = h + ':00';
        };
      }

      container.appendChild(slot);
    }
  }

  // 🚀 ENVIAR A GOOGLE SHEETS
  window.enviarCita = function() {

    var nombre    = document.getElementById('nombre').value.trim();
    var telefono  = document.getElementById('telefono').value.trim();
    var fecha     = document.getElementById('fecha').value;
    var direccion = document.getElementById('direccion').value.trim();
    var notas     = document.getElementById('notas').value.trim();

    if (!nombre || !telefono || !fecha || !direccion || !selectedHour) {
      showToast('Completa todos los campos', 'error');
      return;
    }

    var extrasArr = [];
    document.querySelectorAll('.extras-check input').forEach(cb => {
      if (cb.checked) extrasArr.push(cb.getAttribute('data-label'));
    });

    var datos = {
      nombre,
      telefono,
      fecha,
      hora: selectedHour,
      servicio: selectedService,
      tamano: document.getElementById('tamano').selectedOptions[0].text,
      extras: extrasArr.join(', '),
      total,
      notas,
      direccion
    };

    console.log("ENVIANDO:", datos);

    fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify(datos),
      headers: { 'Content-Type': 'application/json' }
    })
    .then(r => r.json())
    .then(d => {
      console.log("RESPUESTA:", d);

      if (d.ok) {
        showToast('Cita enviada ✔', 'success');

        document.getElementById('booking-form-wrap').style.display = 'none';
        document.getElementById('success-screen').classList.add('show');
      } else {
        showToast('Error del servidor', 'error');
      }
    })
    .catch(() => showToast('Error de conexión', 'error'));
  };

  // TOAST
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

})();
</script>

</body>
</html>
