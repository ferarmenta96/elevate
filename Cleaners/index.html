<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Cleaners RGV</title>

<style>
body { font-family: Arial; margin:0; background:#f4f7fb; }
.view { display:none; padding:20px; }
.view.active { display:block; }
button { padding:10px 20px; cursor:pointer; }

.hero { background:#1a4a7c; color:white; text-align:center; padding:40px; }

.service-option, .extra-toggle, .time-slot {
  border:1px solid #ccc; padding:10px; margin:5px; cursor:pointer;
}

.selected { background:#1a5fa8; color:white; }
.checked { background:#d0e7f7; }

.time-slot.occupied { opacity:0.3; cursor:not-allowed; }
</style>
</head>
<body>

<!-- NAV -->
<button onclick="showView('home')">Inicio</button>
<button onclick="showView('booking')">Agendar</button>

<!-- HOME -->
<div id="view-home" class="view active">
  <div class="hero">
    <h1>House Cleaners RGV</h1>
    <button onclick="showView('booking')">Agendar</button>
  </div>
</div>

<!-- BOOKING -->
<div id="view-booking" class="view">

  <h2>Agendar</h2>

  <!-- SERVICIO -->
  <div>
    <div id="opt-basic" class="service-option selected" onclick="selectService('basic')">Basic</div>
    <div id="opt-deep" class="service-option" onclick="selectService('deep')">Deep</div>
  </div>

  <!-- TAMAÑO -->
  <select id="tamano" onchange="calcTotal()"></select>

  <!-- EXTRAS -->
  <div class="extras-check">
    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Baño Extra"> 🚽 Baño Extra +$20
    </label>

    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Refrigerador"> 🧊 Refrigerador +$20
    </label>

    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Ventanas"> 🪟 Ventanas +$20
    </label>

    <label class="extra-toggle" onclick="toggleExtra(event.target)">
      <input type="checkbox" value="20" data-label="Microwave"> 📡 Microwave +$20
    </label>
  </div>

  <!-- FECHA -->
  <input type="date" id="fecha" onchange="cargarHorarios()">

  <!-- HORAS -->
  <div id="horarios-wrap" style="display:none;">
    <div id="time-slots"></div>
  </div>

  <!-- DATOS -->
  <input id="nombre" placeholder="Nombre"><br>
  <input id="telefono" placeholder="Telefono"><br>
  <input id="direccion" placeholder="Direccion"><br>

  <h3 id="total-display">$100</h3>

  <button onclick="enviarCita()">Confirmar</button>

</div>

<script>
'use strict';

// 🔥 PON TU URL AQUÍ
var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzo8nApLan4FL2juOxsG3tP8y0WgGpid4UWQv7dRji-mHpCFb8Aq-yicOZR_JvVuN62/exec";

// STATE
var selectedService = 'basic';
var selectedHour = null;
var total = 100;

var PRICES = {
  basic: [100,130,160],
  deep: [120,160,180]
};

var SIZES = ['Pequeño','Medio','Grande'];

// INIT
document.addEventListener("DOMContentLoaded", function(){
  document.getElementById('fecha').min = new Date().toISOString().split('T')[0];
  updateTamanoOptions();
});

// NAV
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
}

// SERVICE
function selectService(type){
  selectedService = type;

  document.getElementById('opt-basic').classList.toggle('selected', type==='basic');
  document.getElementById('opt-deep').classList.toggle('selected', type==='deep');

  updateTamanoOptions();
}

function updateTamanoOptions(){
  var sel = document.getElementById('tamano');
  var prices = PRICES[selectedService];

  sel.innerHTML = SIZES.map((s,i)=>`<option value="${prices[i]}">${s} - $${prices[i]}</option>`).join('');

  calcTotal();
}

// ✅ FIX REAL
function toggleExtra(el){
  let label = el.closest('.extra-toggle');
  if(!label) return;

  let cb = label.querySelector('input');
  if(!cb) return;

  cb.checked = !cb.checked;
  label.classList.toggle('checked', cb.checked);

  calcTotal();
}

// TOTAL
function calcTotal(){
  var base = parseInt(document.getElementById('tamano').value)||100;
  var extras = 0;

  document.querySelectorAll('.extras-check input').forEach(cb=>{
    if(cb.checked) extras += parseInt(cb.value);
  });

  total = base + extras;
  document.getElementById('total-display').innerText = "$"+total;
}

// HORARIOS
function cargarHorarios(){
  var fecha = document.getElementById('fecha').value;
  if(!fecha) return;

  selectedHour = null;
  document.getElementById('horarios-wrap').style.display='block';

  renderSlots([9,14]); // demo
}

function renderSlots(ocupadas){
  var cont = document.getElementById('time-slots');
  cont.innerHTML='';

  for(let h=8;h<=18;h++){
    let div=document.createElement('div');
    div.className='time-slot'+(ocupadas.includes(h)?' occupied':'');
    div.innerText=h+":00";

    if(!ocupadas.includes(h)){
      div.onclick=function(){
        document.querySelectorAll('.time-slot').forEach(s=>s.classList.remove('selected'));
        div.classList.add('selected');
        selectedHour=h+":00";
      }
    }

    cont.appendChild(div);
  }
}

// 🚀 ENVIAR
function enviarCita(){

  var nombre=document.getElementById('nombre').value;
  var telefono=document.getElementById('telefono').value;
  var fecha=document.getElementById('fecha').value;
  var direccion=document.getElementById('direccion').value;

  if(!nombre||!telefono||!fecha||!direccion||!selectedHour){
    alert("Faltan datos");
    return;
  }

  var extrasArr=[];
  document.querySelectorAll('.extras-check input').forEach(cb=>{
    if(cb.checked) extrasArr.push(cb.dataset.label);
  });

  var datos={
    nombre,
    telefono,
    fecha,
    hora:selectedHour,
    servicio:selectedService,
    tamano:document.getElementById('tamano').value,
    extras:extrasArr.join(', '),
    total,
    direccion
  };

  console.log("ENVIANDO:", datos);

  fetch(WEB_APP_URL,{
    method:"POST",
    body:JSON.stringify(datos),
    headers:{"Content-Type":"application/json"}
  })
  .then(r=>r.json())
  .then(r=>{
    console.log("RESPUESTA:", r);
    alert("Cita enviada ✔");
  })
  .catch(err=>{
    console.error(err);
    alert("Error al enviar");
  });
}

// SERVICE WORKER
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>

</body>
</html>
